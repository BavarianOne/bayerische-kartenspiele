<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spritpreise Landshut">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Spritpreise Landshut</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>⛽ Spritpreise Landshut</h1>
      <div class="updated" id="fetchedAt">Datenstand: –</div>
    </header>
    <div class="workflow-info" id="workflowRunAt">🔄 Letzter GitHub Actions Run: –</div>
    
    <div class="stats-box" id="stats">
      <!-- Stats injected by JS -->
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Tankstelle</th>
          <th>Diesel</th>
          <th>Super E10</th>
          <th>Super E5</th>
        </tr>
      </thead>
      <tbody id="stationTbody">
        <tr><td colspan="4" style="text-align:center; padding: 40px; color: #666;">Lade Preise…</td></tr>
      </tbody>
    </table>
    
    <div class="legend">
      <div class="legend-item"><span class="legend-color" style="background:#0066cc"></span> Diesel</div>
      <div class="legend-item"><span class="legend-color" style="background:#cc6600"></span> Super E10</div>
      <div class="legend-item"><span class="legend-color" style="background:#009933"></span> Super E5</div>
    </div>
    <footer>
      Datenquelle: <a href="https://www.clever-tanken.de/tankstelle_liste?ort=Landshut" target="_blank">clever-tanken.de</a> (MTS-K)<br>
      Preise können abweichen. | Auto-Update alle 30 Min (07-20:30 Uhr)
    </footer>
  </div>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/landshut-spritpreise-pwa/sw.js', { scope: '/landshut-spritpreise-pwa/' })
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
