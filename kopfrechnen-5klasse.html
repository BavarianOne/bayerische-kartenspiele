<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopfrechnen 5. Klasse Gymnasium Bayern</title>
<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --fg: #1e293b;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --success: #16a34a;
  --success-bg: #dcfce7;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --warn: #f59e0b;
  --border: #e2e8f0;
  --shadow: 0 4px 24px rgba(15,23,42,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.15s ease;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --fg: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --success: #22c55e;
    --success-bg: #14532d;
    --danger: #ef4444;
    --danger-bg: #7f1d1d;
    --warn: #fbbf24;
    --border: #334155;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  line-height: 1.5;
}
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg);
}
.header p { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 520px;
  padding: 28px 24px;
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: 0 8px 32px rgba(15,23,42,0.12); }
@media (prefers-color-scheme: dark) {
  .card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.45); }
}
.mode-select {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.mode-btn {
  padding: 12px 24px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border);
  background: var(--card);
  color: var(--fg);
  cursor: pointer;
  transition: all var(--transition);
}
.mode-btn:hover { border-color: var(--accent); color: var(--accent); }
.mode-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  box-shadow: 0 2px 8px rgba(37,99,235,0.3);
}
.stats {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 80px;
}
.stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
}
.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
}
.stat-value.time { color: var(--warn); }
.stat-value.score { color: var(--accent); }
.stat-value.streak { color: var(--success); }
.stat-value.highscore { color: var(--warn); }
.task-area {
  margin-bottom: 20px;
}
.task-display {
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.01em;
  min-height: 1.2em;
  padding: 20px 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  border: 2px solid var(--border);
  font-family: 'SF Mono', 'Fira Code', monospace;
  transition: border-color var(--transition), background var(--transition);
}
.task-display.correct { border-color: var(--success); background: var(--success-bg); }
.task-display.wrong { border-color: var(--danger); background: var(--danger-bg); }
.feedback {
  text-align: center;
  min-height: 1.6em;
  margin-top: 12px;
  font-size: 1.1rem;
  font-weight: 500;
  transition: color var(--transition);
}
.feedback.correct { color: var(--success); }
.feedback.wrong { color: var(--danger); }
.feedback.info { color: var(--muted); }
.input-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
#answerInput {
  width: 100%;
  max-width: 220px;
  padding: 14px 18px;
  font-size: 1.25rem;
  font-weight: 600;
  text-align: center;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--fg);
  transition: border-color var(--transition), box-shadow var(--transition);
}
#answerInput:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
#answerInput.correct { border-color: var(--success); }
#answerInput.wrong { border-color: var(--danger); }
#answerInput:disabled { opacity: 0.6; cursor: not-allowed; }
.btn {
  padding: 14px 28px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  transition: all var(--transition);
}
.btn-primary {
  background: var(--accent);
  color: white;
  width: 100%;
  max-width: 300px;
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(37,99,235,0.3);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
}
.btn-secondary:hover { background: rgba(37,99,235,0.08); }
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 16px;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  border-radius: 3px;
  transition: width 0.3s ease;
}
.history {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.history h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 10px;
}
.history-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.history-item {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  animation: slideIn 0.25s ease;
}
.history-item.correct { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
.history-item.wrong { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
}
.footer kbd {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  font-family: inherit;
  font-size: 0.85em;
}
.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Mobile: kompakter, kein Scroll nötig */
@media (max-width: 480px) {
  body { padding: 8px 6px; align-items: stretch; justify-content: flex-start; min-height: 100vh; }
  .header { margin-bottom: 8px; }
  .header h1 { font-size: 1.3rem; }
  .header p { font-size: 0.75rem; margin-top: 2px; }
  .card { padding: 12px 8px; border-radius: 12px; }
  .mode-select { gap: 6px; margin-bottom: 10px; }
  .mode-btn { padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; }
  .stats { gap: 8px; margin-bottom: 10px; padding: 8px; border-radius: 8px; }
  .stat { min-width: 0; flex: 1; gap: 1px; }
  .stat-label { font-size: 0.55rem; letter-spacing: 0.04em; }
  .stat-value { font-size: 1.1rem; }
  .task-area { margin-bottom: 8px; }
  .task-display { font-size: clamp(1.6rem, 8vw, 2.2rem); padding: 12px 8px; min-height: 1.1em; border-radius: 8px; }
  .feedback { min-height: 1.3em; margin-top: 6px; font-size: 0.9rem; }
  .input-row { margin-bottom: 8px; }
  #answerInput { padding: 10px 12px; font-size: 1.1rem; max-width: 100%; border-radius: 8px; }
  .btn-primary { padding: 10px 16px; font-size: 0.9rem; border-radius: 8px; max-width: 100%; }
  .progress-bar { height: 4px; margin-top: 8px; border-radius: 2px; }
  .history { margin-top: 10px; padding-top: 8px; }
  .history h3 { font-size: 0.7rem; margin-bottom: 6px; }
  .history-item { padding: 4px 8px; font-size: 0.65rem; border-radius: 12px; }
  .footer { margin-top: 8px; font-size: 0.65rem; }
  .footer kbd { padding: 1px 5px; font-size: 0.75em; border-radius: 4px; }
}
</style>
</head>
<body>
<header class="header">
  <h1>🧮 Kopfrechnen 5. Klasse</h1>
  <p>Lehrplan Bayern Gymnasium • Natürliche Zahlen • Einheiten</p>
</header>

<main class="card" role="main">
  <div class="mode-select" role="radiogroup" aria-label="Spielmodus wählen">
    <button class="mode-btn active" data-mode="time" role="radio" aria-checked="true">⏱ Zeitmodus (60 s)</button>
    <button class="mode-btn" data-mode="practice" role="radio" aria-checked="false">📝 Übungsmodus (10 Aufgaben)</button>
  </div>

  <div class="stats" aria-live="polite">
    <div class="stat"><span class="stat-label">Zeit</span><span class="stat-value time" id="timeStat">60</span></div>
    <div class="stat"><span class="stat-label">Punkte</span><span class="stat-value score" id="scoreStat">0</span></div>
    <div class="stat"><span class="stat-label">Serie</span><span class="stat-value streak" id="streakStat">0</span></div>
    <div class="stat"><span class="stat-label">Highscore</span><span class="stat-value highscore" id="highscoreStat">0</span></div>
  </div>

  <div class="task-area">
    <div class="task-display" id="taskDisplay" aria-live="assertive" role="status">Drücke Start</div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </div>

  <div class="input-row">
    <input type="text" id="answerInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Deine Antwort" placeholder="Antwort" disabled>
  </div>

  <button class="btn btn-primary" id="startBtn">Start</button>

  <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="history" id="history" hidden>
    <h3>Verlauf</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <footer class="footer">
    <kbd>Enter</kbd> = Bestätigen &nbsp;|&nbsp; <kbd>Space</kbd> = Neues Spiel (nach Ende)
  </footer>
</main>

<script>
(() => {
const ROUNDS_PRACTICE = 10;
const TIME_LIMIT = 60;

const taskDisplay = document.getElementById('taskDisplay');
const feedback = document.getElementById('feedback');
const answerInput = document.getElementById('answerInput');
const startBtn = document.getElementById('startBtn');
const timeStat = document.getElementById('timeStat');
const scoreStat = document.getElementById('scoreStat');
const streakStat = document.getElementById('streakStat');
const highscoreStat = document.getElementById('highscoreStat');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const history = document.getElementById('history');
const historyList = document.getElementById('historyList');
const modeBtns = document.querySelectorAll('.mode-btn');

let mode = 'time';
let gameActive = false;
let timeLeft = TIME_LIMIT;
let score = 0;
let streak = 0;
let bestStreak = 0;
let currentAnswer = null;
let currentTask = null;
let timerId = null;
let roundCount = 0;
let highscore = parseInt(localStorage.getItem('kopfrechnen_hs') || '0', 10);
highscoreStat.textContent = highscore;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

const UNITS = [
  { from: 'km', to: 'm', factor: 1000, max: 5 },
  { from: 'm', to: 'cm', factor: 100, max: 50 },
  { from: 'cm', to: 'mm', factor: 10, max: 50 },
  { from: 'kg', to: 'g', factor: 1000, max: 5 },
  { from: 'l', to: 'ml', factor: 1000, max: 5 },
  { from: '€', to: 'ct', factor: 100, max: 20 },
  { from: 'h', to: 'min', factor: 60, max: 4 },
  { from: 'min', to: 's', factor: 60, max: 10 },
  { from: 'm', to: 'mm', factor: 1000, max: 2 },
];

function genUnitTask() {
  const u = pick(UNITS);
  const val = randInt(1, u.max);
  const total = val * u.factor;
  if (Math.random() < 0.5) {
    return { q: `${val} ${u.from} = ? ${u.to}`, a: total };
  } else {
    return { q: `? ${u.from} = ${total} ${u.to}`, a: val };
  }
}

function genBasicTask() {
  const type = randInt(1, 4);
  let a, b, ans, q;
  switch (type) {
    case 1: // Addition bis 1000
      a = randInt(100, 900);
      b = randInt(100, 1000 - a);
      ans = a + b;
      q = `${a} + ${b}`;
      break;
    case 2: // Subtraktion bis 1000
      a = randInt(200, 1000);
      b = randInt(100, a - 1);
      ans = a - b;
      q = `${a} - ${b}`;
      break;
    case 3: // Multiplikation bis 20x20
      a = randInt(2, 20);
      b = randInt(2, 20);
      ans = a * b;
      q = `${a} · ${b}`;
      break;
    case 4: // Division bis 20x20 (exakt teilbar)
      ans = randInt(2, 20);
      b = randInt(2, 20);
      a = ans * b;
      q = `${a} : ${b}`;
      break;
  }
  return { q, a: ans };
}

function genGapTask() {
  const type = randInt(1, 4);
  let a, b, c, ans, q;
  switch (type) {
    case 1: // x + a = b
      a = randInt(50, 500);
      ans = randInt(50, 500);
      b = a + ans;
      q = `x + ${a} = ${b}`;
      break;
    case 2: // a - x = b
      ans = randInt(50, 500);
      a = randInt(ans + 50, 1000);
      b = a - ans;
      q = `${a} - x = ${b}`;
      break;
    case 3: // x · a = b  (kleines 1x1 / erweitertes)
      a = randInt(2, 15);
      ans = randInt(2, 15);
      b = a * ans;
      q = `x · ${a} = ${b}`;
      break;
    case 4: // a : x = b
      ans = randInt(2, 20);
      b = randInt(2, 20);
      a = ans * b;
      q = `${a} : x = ${b}`;
      break;
  }
  return { q, a: ans };
}

function genOrderTask() {
  // Punkt vor Strich: a + b * c  oder  a * b + c  etc.
  const pattern = randInt(1, 4);
  let a, b, c, ans, q;
  switch (pattern) {
    case 1: // a + b * c
      a = randInt(10, 100);
      b = randInt(2, 12);
      c = randInt(2, 12);
      ans = a + b * c;
      q = `${a} + ${b} · ${c}`;
      break;
    case 2: // a * b + c
      a = randInt(2, 12);
      b = randInt(2, 12);
      c = randInt(10, 100);
      ans = a * b + c;
      q = `${a} · ${b} + ${c}`;
      break;
    case 3: // a - b * c
      b = randInt(2, 12);
      c = randInt(2, 12);
      a = randInt(b * c + 10, 500);
      ans = a - b * c;
      q = `${a} - ${b} · ${c}`;
      break;
    case 4: // a * b - c
      a = randInt(2, 12);
      b = randInt(2, 12);
      c = randInt(1, a * b - 1);
      ans = a * b - c;
      q = `${a} · ${b} - ${c}`;
      break;
  }
  return { q, a: ans };
}

function genTask() {
  const r = Math.random();
  if (r < 0.25) return genBasicTask();
  if (r < 0.40) return genGapTask();
  if (r < 0.55) return genOrderTask();
  return genUnitTask();
}

function setMode(m) {
  mode = m;
  modeBtns.forEach(b => {
    const active = b.dataset.mode === m;
    b.classList.toggle('active', active);
    b.setAttribute('aria-checked', active);
  });
  resetGame();
}

function updateStats() {
  scoreStat.textContent = score;
  streakStat.textContent = streak;
  if (mode === 'time') {
    timeStat.textContent = timeLeft;
    const pct = (timeLeft / TIME_LIMIT) * 100;
    progressFill.style.width = `${pct}%`;
    progressBar.setAttribute('aria-valuenow', timeLeft);
  } else {
    timeStat.textContent = `${roundCount} / ${ROUNDS_PRACTICE}`;
    const pct = (roundCount / ROUNDS_PRACTICE) * 100;
    progressFill.style.width = `${pct}%`;
    progressBar.setAttribute('aria-valuenow', roundCount);
  }
}

function addToHistory(task, userAns, correct) {
  history.hidden = false;
  const item = document.createElement('div');
  item.className = `history-item ${correct ? 'correct' : 'wrong'}`;
  const u = userAns === null ? '—' : userAns;
  item.textContent = `${task.q} = ${task.a}  (deine: ${u})`;
  historyList.prepend(item);
  if (historyList.children.length > 20) historyList.lastChild.remove();
}

function showTask() {
  currentTask = genTask();
  currentAnswer = currentTask.a;
  taskDisplay.textContent = currentTask.q;
  taskDisplay.className = 'task-display';
  feedback.textContent = '';
  feedback.className = 'feedback';
  answerInput.value = '';
  answerInput.disabled = false;
  answerInput.className = '';
  answerInput.focus({ preventScroll: true });
}

function checkAnswer() {
  const val = answerInput.value.trim();
  if (val === '') return;
  const userAns = parseInt(val, 10);
  const correct = userAns === currentAnswer;

  answerInput.disabled = true;
  if (correct) {
    score += 10 + Math.min(streak, 5) * 2;
    streak++;
    taskDisplay.classList.add('correct');
    feedback.textContent = `✓ Richtig! +${10 + Math.min(streak-1, 5) * 2} Punkte`;
    feedback.className = 'feedback correct';
    answerInput.classList.add('correct');
  } else {
    streak = 0;
    taskDisplay.classList.add('wrong');
    feedback.textContent = `✗ Falsch. Richtig: ${currentAnswer}`;
    feedback.className = 'feedback wrong';
    answerInput.classList.add('wrong');
  }
  addToHistory(currentTask, userAns, correct);
  updateStats();

  setTimeout(() => {
    if (gameActive) nextRound();
  }, 1100);
}

function nextRound() {
  if (mode === 'practice') {
    roundCount++;
    if (roundCount >= ROUNDS_PRACTICE) return endGame();
  }
  showTask();
}

function startTimer() {
  timerId = setInterval(() => {
    timeLeft--;
    updateStats();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function startGame() {
  if (gameActive) return;
  gameActive = true;
  score = 0;
  streak = 0;
  roundCount = 0;
  timeLeft = TIME_LIMIT;
  historyList.innerHTML = '';
  history.hidden = true;
  startBtn.textContent = 'Läuft…';
  startBtn.disabled = true;
  startBtn.classList.add('hidden');
  updateStats();
  showTask();
  if (mode === 'time') startTimer();
}

function endGame() {
  gameActive = false;
  clearInterval(timerId);
  answerInput.disabled = true;
  taskDisplay.textContent = 'Fertig!';
  taskDisplay.className = 'task-display';
  feedback.textContent = `Ende. Punkte: ${score} | Highscore: ${Math.max(highscore, score)}`;
  feedback.className = 'feedback info';
  startBtn.textContent = mode === 'time' ? 'Neu starten (60 s)' : 'Neu starten (10 Aufgaben)';
  startBtn.disabled = false;
  startBtn.classList.remove('hidden');
  progressFill.style.width = '0%';

  if (score > highscore) {
    highscore = score;
    localStorage.setItem('kopfrechnen_hs', String(highscore));
    highscoreStat.textContent = highscore;
    feedback.textContent += ' 🎉 Neuer Highscore!';
  }
}

function resetGame() {
  clearInterval(timerId);
  gameActive = false;
  score = 0;
  streak = 0;
  roundCount = 0;
  timeLeft = TIME_LIMIT;
  historyList.innerHTML = '';
  history.hidden = true;
  taskDisplay.textContent = 'Drücke Start';
  taskDisplay.className = 'task-display';
  feedback.textContent = '';
  feedback.className = 'feedback';
  answerInput.value = '';
  answerInput.disabled = true;
  answerInput.className = '';
  startBtn.textContent = 'Start';
  startBtn.disabled = false;
  startBtn.classList.remove('hidden');
  updateStats();
  progressFill.style.width = '0%';
}

answerInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAnswer();
});

startBtn.addEventListener('click', () => {
  if (!gameActive) startGame();
});

modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !gameActive && !startBtn.classList.contains('hidden')) {
    e.preventDefault();
    startGame();
  }
});

answerInput.addEventListener('input', () => {
  answerInput.value = answerInput.value.replace(/[^0-9]/g, '');
});

resetGame();
})();
</script>
</body>
</html>
