<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="description" content="Flappy Bird - Klassisches Arcade-Spiel">
    <title>🐦 Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-sky: #70c5ce;
            --bg-sky-dark: #4ec0ca;
            --pipe-green: #74bf2e;
            --pipe-green-dark: #5e9c26;
            --pipe-highlight: #8fd83e;
            --pipe-shadow: #4a7c1f;
            --bird-yellow: #f8d210;
            --bird-yellow-dark: #e8b80a;
            --bird-orange: #f5a623;
            --ground-color: #ded895;
            --ground-dark: #c4bd84;
            --text-dark: #3d3d3d;
            --text-light: #fff;
            --ui-bg: rgba(255, 255, 255, 0.9);
            --ui-border: #3d3d3d;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-sky: #4a4a6a;
                --bg-sky-dark: #3a3a5a;
                --pipe-green: #5aa31e;
                --pipe-green-dark: #457a18;
                --pipe-highlight: #6fd82e;
                --pipe-shadow: #355a14;
                --bird-yellow: #f0c808;
                --bird-yellow-dark: #d4a806;
                --bird-orange: #e89018;
                --ground-color: #8b7d4a;
                --ground-dark: #6b5d38;
                --text-dark: #e0e0e0;
                --text-light: #fff;
                --ui-bg: rgba(40, 40, 60, 0.95);
                --ui-border: #e0e0e0;
            }
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg-sky);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gameCanvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 100vw;
            max-height: 100vh;
        }

        .ui-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .ui-panel {
            background: var(--ui-bg);
            border: 3px solid var(--ui-border);
            border-radius: 8px;
            padding: 30px 40px;
            text-align: center;
            min-width: 280px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            pointer-events: auto;
        }

        .ui-panel.hidden { display: none; }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 var(--pipe-green);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .score-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 15px 0;
        }

        .score-label { opacity: 0.7; font-size: 1rem; }
        .score-value { color: var(--pipe-green); }

        .highscore-display {
            font-size: 1rem;
            color: var(--bird-orange);
            margin-bottom: 20px;
        }

        .btn {
            background: var(--pipe-green);
            color: var(--text-light);
            border: 3px solid var(--pipe-green-dark);
            border-radius: 6px;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 var(--pipe-green-dark);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--pipe-green-dark);
        }

        .btn:focus-visible { outline: 2px solid var(--bird-yellow); outline-offset: 2px; }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-dark);
            opacity: 0.7;
            line-height: 1.6;
        }

        .current-score {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-light);
            text-shadow: 3px 3px 0 var(--text-dark), 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s;
        }

        .current-score.hidden { opacity: 0; pointer-events: none; }

        @media (max-width: 480px) {
            .ui-panel { padding: 20px 24px; min-width: 240px; margin: 10px; }
            .title { font-size: 2rem; }
            .current-score { font-size: 2.5rem; top: 15px; }
            .btn { padding: 12px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="current-score hidden" id="currentScore">0</div>

    <div class="ui-overlay">
        <!-- Start Screen -->
        <div class="ui-panel" id="startScreen">
            <h1 class="title">🐦 Flappy Bird</h1>
            <p class="subtitle">Tippe oder drücke Leertaste zum Fliegen</p>
            <div class="highscore-display">
                Highscore: <span id="startHighscore">0</span>
            </div>
            <button class="btn" id="startBtn">Starten</button>
            <p class="controls-hint">
                <strong>Steuerung:</strong> Leertaste • Mausklick • Touch<br>
                Vermeide die Rohre und den Boden!
            </p>
        </div>

        <!-- Game Over Screen -->
        <div class="ui-panel hidden" id="gameOverScreen">
            <h1 class="title">Game Over</h1>
            <div class="score-display">
                <span class="score-label">Score: </span>
                <span class="score-value" id="finalScore">0</span>
            </div>
            <div class="highscore-display">
                Highscore: <span id="gameOverHighscore">0</span>
            </div>
            <button class="btn" id="restartBtn">Nochmal</button>
            <p class="controls-hint">Leertaste / Klick / Touch zum Neustart</p>
        </div>
    </div>

    <script>
        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const CONFIG = {
            // Canvas
            canvasWidth: 400,
            canvasHeight: 600,

            // Physics - extrem sanft, fast schwebend
            gravity: 0.15,
            jumpForce: -4.5,
            maxFallSpeed: 5,
            rotationSpeed: 0.04,
            maxRotationUp: -0.3,
            maxRotationDown: 0.6,

            // Bird
            birdX: 80,
            birdWidth: 24,
            birdHeight: 16,
            birdStartY: 300,

            // Pipes - riesiger Gap, sehr langsam
            pipeWidth: 48,
            pipeGap: 240,
            pipeSpawnInterval: 2200,
            pipeSpeed: 1.8,
            minPipeHeight: 20,
            maxPipeHeightOffset: 200,

            // Ground
            groundHeight: 80,
            groundSpeed: 1.8,

            // Visual
            skyGradientStops: ['#70c5ce', '#4ec0ca'],
        };

        // ============================================
        // GAME STATE
        // ============================================
        let canvas, ctx;
        let state = 'start'; // 'start', 'playing', 'gameOver'
        let score = 0;
        let highscore = 0;
        let frames = 0;

        let bird = { y: 0, velocity: 0, rotation: 0 };
        let pipes = [];
        let groundOffset = 0;
        let lastPipeSpawn = 0;
        let animationId = null;

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Load highscore
            highscore = parseInt(localStorage.getItem('flappyBirdHighscore') || '0', 10);
            updateHighscoreDisplay();

            // Setup canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Input handlers
            window.addEventListener('keydown', handleKeydown);
            canvas.addEventListener('mousedown', handleInput);
            canvas.addEventListener('touchstart', handleTouch, { passive: false });

            // UI buttons
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);

            // Start render loop
            gameLoop();
        }

        function resizeCanvas() {
            const maxWidth = window.innerWidth * 0.95;
            const maxHeight = window.innerHeight * 0.95;
            const ratio = CONFIG.canvasWidth / CONFIG.canvasHeight;

            let width = Math.min(CONFIG.canvasWidth, maxWidth);
            let height = width / ratio;

            if (height > maxHeight) {
                height = maxHeight;
                width = height * ratio;
            }

            canvas.width = CONFIG.canvasWidth;
            canvas.height = CONFIG.canvasHeight;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        // ============================================
        // INPUT HANDLING
        // ============================================
        function handleKeydown(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                handleInput();
            }
        }

        function handleTouch(e) {
            e.preventDefault();
            handleInput();
        }

        function handleInput() {
            if (state === 'start') {
                startGame();
            } else if (state === 'playing') {
                bird.velocity = CONFIG.jumpForce;
            } else if (state === 'gameOver') {
                startGame();
            }
        }

        // ============================================
        // GAME STATE MANAGEMENT
        // ============================================
        function startGame() {
            state = 'playing';
            score = 0;
            frames = 0;
            pipes = [];
            groundOffset = 0;
            lastPipeSpawn = 0;

            bird = {
                y: CONFIG.birdStartY,
                velocity: CONFIG.jumpForce, // Sofort erster Flap beim Start
                rotation: CONFIG.maxRotationUp
            };

            updateScoreDisplay();
            hideAllScreens();
            document.getElementById('currentScore').classList.remove('hidden');
        }

        function gameOver() {
            state = 'gameOver';

            if (score > highscore) {
                highscore = score;
                localStorage.setItem('flappyBirdHighscore', highscore.toString());
                updateHighscoreDisplay();
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverHighscore').textContent = highscore;

            document.getElementById('currentScore').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function hideAllScreens() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }

        function updateScoreDisplay() {
            document.getElementById('currentScore').textContent = score;
        }

        function updateHighscoreDisplay() {
            document.getElementById('startHighscore').textContent = highscore;
            document.getElementById('gameOverHighscore').textContent = highscore;
        }

        // ============================================
        // GAME LOGIC
        // ============================================
        function update() {
            if (state !== 'playing') return;

            frames++;

            // Bird physics
            bird.velocity += CONFIG.gravity;
            if (bird.velocity > CONFIG.maxFallSpeed) bird.velocity = CONFIG.maxFallSpeed;
            bird.y += bird.velocity;

            // Bird rotation
            if (bird.velocity < 0) {
                bird.rotation = Math.max(CONFIG.maxRotationUp, bird.rotation - CONFIG.rotationSpeed);
            } else {
                bird.rotation = Math.min(CONFIG.maxRotationDown, bird.rotation + CONFIG.rotationSpeed * 0.5);
            }

            // Ground movement
            groundOffset = (groundOffset + CONFIG.groundSpeed) % 32;

            // Spawn pipes
            if (frames * (1000/60) - lastPipeSpawn > CONFIG.pipeSpawnInterval) {
                spawnPipe();
                lastPipeSpawn = frames * (1000/60);
            }

            // Update pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= CONFIG.pipeSpeed;

                // Score point
                if (!pipes[i].scored && pipes[i].x + CONFIG.pipeWidth < CONFIG.birdX) {
                    pipes[i].scored = true;
                    score++;
                    updateScoreDisplay();
                }

                // Remove off-screen pipes
                if (pipes[i].x + CONFIG.pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }

            // Collision detection
            checkCollisions();
        }

        function spawnPipe() {
            const maxTopHeight = CONFIG.canvasHeight - CONFIG.groundHeight - CONFIG.pipeGap - CONFIG.minPipeHeight;
            const topHeight = CONFIG.minPipeHeight + Math.random() * maxTopHeight;

            pipes.push({
                x: CONFIG.canvasWidth,
                topHeight: topHeight,
                scored: false
            });
        }

        function checkCollisions() {
            const birdLeft = CONFIG.birdX;
            const birdRight = CONFIG.birdX + CONFIG.birdWidth;
            const birdTop = bird.y;
            const birdBottom = bird.y + CONFIG.birdHeight;

            // Ground collision
            if (birdBottom >= CONFIG.canvasHeight - CONFIG.groundHeight) {
                gameOver();
                return;
            }

            // Ceiling collision
            if (birdTop <= 0) {
                gameOver();
                return;
            }

            // Pipe collisions
            for (const pipe of pipes) {
                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + CONFIG.pipeWidth;
                const gapTop = pipe.topHeight;
                const gapBottom = pipe.topHeight + CONFIG.pipeGap;

                // Horizontal overlap
                if (birdRight > pipeLeft && birdLeft < pipeRight) {
                    // Top pipe collision
                    if (birdTop < gapTop) {
                        gameOver();
                        return;
                    }
                    // Bottom pipe collision
                    if (birdBottom > gapBottom) {
                        gameOver();
                        return;
                    }
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            // Clear
            ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

            // Sky gradient
            drawSky();

            // Pipes
            drawPipes();

            // Ground
            drawGround();

            // Bird
            drawBird();

            // Score (in-game overlay during play)
            if (state === 'playing') {
                drawScoreOverlay();
            }
        }

        function drawSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.canvasHeight);
            gradient.addColorStop(0, CONFIG.skyGradientStops[0]);
            gradient.addColorStop(1, CONFIG.skyGradientStops[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

            // Clouds (simple decorative)
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            const cloudOffset = (frames * 0.1) % (CONFIG.canvasWidth + 100);
            drawCloud(100 - cloudOffset, 80);
            drawCloud(300 - cloudOffset, 120);
            drawCloud(500 - cloudOffset, 60);
        }

        function drawCloud(x, y) {
            if (x < -80) x += CONFIG.canvasWidth + 160;
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 25, y - 5, 18, 0, Math.PI * 2);
            ctx.arc(x + 50, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 25, y + 10, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPipes() {
            for (const pipe of pipes) {
                const x = pipe.x;
                const w = CONFIG.pipeWidth;
                const topH = pipe.topHeight;
                const gapH = CONFIG.pipeGap;
                const bottomY = topH + gapH;
                const bottomH = CONFIG.canvasHeight - CONFIG.groundHeight - bottomY;

                // Top pipe
                drawPipe(x, 0, w, topH, true);
                // Bottom pipe
                drawPipe(x, bottomY, w, bottomH, false);
            }
        }

        function drawPipe(x, y, w, h, isTop) {
            const pipeBodyColor = getComputedStyle(document.documentElement).getPropertyValue('--pipe-green').trim() || '#74bf2e';
            const pipeDarkColor = getComputedStyle(document.documentElement).getPropertyValue('--pipe-green-dark').trim() || '#5e9c26';
            const pipeHighlightColor = getComputedStyle(document.documentElement).getPropertyValue('--pipe-highlight').trim() || '#8fd83e';
            const pipeShadowColor = getComputedStyle(document.documentElement).getPropertyValue('--pipe-shadow').trim() || '#4a7c1f';

            // Pipe body
            ctx.fillStyle = pipeBodyColor;
            ctx.fillRect(x, y, w, h);

            // Highlight (left edge)
            ctx.fillStyle = pipeHighlightColor;
            ctx.fillRect(x, y, 8, h);

            // Shadow (right edge)
            ctx.fillStyle = pipeShadowColor;
            ctx.fillRect(x + w - 8, y, 8, h);

            // Dark vertical lines for texture
            ctx.fillStyle = pipeDarkColor;
            for (let i = 12; i < w - 12; i += 16) {
                ctx.fillRect(x + i, y, 2, h);
            }

            // Pipe cap (wider part at end)
            const capHeight = 30;
            const capWidth = w + 16;
            const capX = x - 8;
            let capY;

            if (isTop) {
                capY = y + h - capHeight;
            } else {
                capY = y;
            }

            // Cap body
            ctx.fillStyle = pipeBodyColor;
            ctx.fillRect(capX, capY, capWidth, capHeight);

            // Cap highlight
            ctx.fillStyle = pipeHighlightColor;
            ctx.fillRect(capX, capY, 10, capHeight);

            // Cap shadow
            ctx.fillStyle = pipeShadowColor;
            ctx.fillRect(capX + capWidth - 10, capY, 10, capHeight);

            // Cap dark lines
            ctx.fillStyle = pipeDarkColor;
            for (let i = 14; i < capWidth - 14; i += 16) {
                ctx.fillRect(capX + i, capY, 2, capHeight);
            }

            // Cap border
            ctx.strokeStyle = pipeDarkColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(capX + 0.5, capY + 0.5, capWidth - 1, capHeight - 1);
        }

        function drawGround() {
            const groundY = CONFIG.canvasHeight - CONFIG.groundHeight;
            const groundColor = getComputedStyle(document.documentElement).getPropertyValue('--ground-color').trim() || '#ded895';
            const groundDarkColor = getComputedStyle(document.documentElement).getPropertyValue('--ground-dark').trim() || '#c4bd84';

            // Ground base
            ctx.fillStyle = groundColor;
            ctx.fillRect(0, groundY, CONFIG.canvasWidth, CONFIG.groundHeight);

            // Ground pattern (grass)
            ctx.fillStyle = groundDarkColor;
            for (let x = -groundOffset; x < CONFIG.canvasWidth + 32; x += 32) {
                ctx.fillRect(x, groundY, 16, CONFIG.groundHeight);
            }

            // Top border line
            ctx.fillStyle = groundDarkColor;
            ctx.fillRect(0, groundY, CONFIG.canvasWidth, 4);

            // Dirt detail
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < 20; i++) {
                const x = (i * 23 + frames * 0.5) % CONFIG.canvasWidth;
                const y = groundY + 10 + (i % 3) * 15;
                ctx.fillRect(x, y, 4, 4);
            }
        }

        function drawBird() {
            const cx = CONFIG.birdX + CONFIG.birdWidth / 2;
            const cy = bird.y + CONFIG.birdHeight / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(bird.rotation);

            const birdYellow = getComputedStyle(document.documentElement).getPropertyValue('--bird-yellow').trim() || '#f8d210';
            const birdYellowDark = getComputedStyle(document.documentElement).getPropertyValue('--bird-yellow-dark').trim() || '#e8b80a';
            const birdOrange = getComputedStyle(document.documentElement).getPropertyValue('--bird-orange').trim() || '#f5a623';

            const hw = CONFIG.birdWidth / 2;
            const hh = CONFIG.birdHeight / 2;

            // Body (ellipse)
            ctx.fillStyle = birdYellow;
            ctx.beginPath();
            ctx.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
            ctx.fill();

            // Belly highlight
            ctx.fillStyle = '#fff8d0';
            ctx.beginPath();
            ctx.ellipse(-2, 2, hw * 0.6, hh * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing (animated)
            const wingOffset = Math.sin(frames * 0.3) * 3;
            ctx.fillStyle = birdYellowDark;
            ctx.beginPath();
            ctx.ellipse(-hw * 0.2, wingOffset, hw * 0.5, hh * 0.4, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(hw * 0.4, -hh * 0.2, 5, 0, Math.PI * 2);
            ctx.fill();

            // Eye highlight
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(hw * 0.45, -hh * 0.25, 2, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = birdOrange;
            ctx.beginPath();
            ctx.moveTo(hw, -3);
            ctx.lineTo(hw + 14, 0);
            ctx.lineTo(hw, 5);
            ctx.closePath();
            ctx.fill();

            // Beak highlight
            ctx.fillStyle = '#ffcc44';
            ctx.beginPath();
            ctx.moveTo(hw + 1, -2);
            ctx.lineTo(hw + 10, 0);
            ctx.lineTo(hw + 1, 3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawScoreOverlay() {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'bold 48px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(score.toString(), CONFIG.canvasWidth / 2, 40);

            // Shadow
            ctx.fillStyle = 'rgba(61,61,61,0.5)';
            ctx.fillText(score.toString(), CONFIG.canvasWidth / 2 + 2, 42);
        }

        // ============================================
        // MAIN LOOP
        // ============================================
        function gameLoop() {
            update();
            render();
            animationId = requestAnimationFrame(gameLoop);
        }

        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
