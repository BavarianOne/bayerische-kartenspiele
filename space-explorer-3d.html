<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌌 Space Explorer 3D – Fliegen & Entdecken</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Space Explorer">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;height:100%;background:#000;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
#topBar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#location{background:rgba(0,10,30,0.85);backdrop-filter:blur(8px);border:1px solid rgba(0,255,200,0.2);border-radius:10px;padding:6px 12px;color:#0fc;font-size:0.75rem;letter-spacing:0.05em;flex:1;min-width:0;overflow:hidden}
#location .name{font-weight:700;font-size:0.85rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#location .hint{color:rgba(255,255,255,0.4);font-size:0.65rem;margin-top:2px}
#speedometer{background:rgba(0,10,30,0.85);backdrop-filter:blur(8px);border:1px solid rgba(255,200,0,0.2);border-radius:10px;padding:6px 10px;text-align:right;min-width:70px;flex-shrink:0}
#speedometer .val{font-size:1.1rem;font-weight:700;color:#fc0;font-variant-numeric:tabular-nums}
#speedometer .unit{font-size:0.6rem;color:rgba(255,200,0,0.5);text-transform:uppercase;letter-spacing:0.1em}
#speedometer .label{font-size:0.6rem;color:rgba(255,200,0,0.4);text-transform:uppercase}

/* Minimap / Radar */
#minimap{position:absolute;top:10px;right:10px;width:140px;height:140px;background:rgba(0,8,20,0.85);backdrop-filter:blur(8px);border:2px solid rgba(0,255,200,0.15);border-radius:50%;overflow:hidden;pointer-events:none;z-index:11;display:none}
#minimap.show{display:block}
#minimap canvas{width:100%;height:100%;display:block}
#minimapLabel{position:absolute;top:10px;right:10px;color:rgba(0,255,200,0.25);font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;z-index:12;pointer-events:none;display:none}
#minimapLabel.show{display:block}

/* Help overlay */
#helpOverlay{position:absolute;bottom:50%;left:50%;transform:translate(-50%,50%);background:rgba(0,10,30,0.85);backdrop-filter:blur(8px);border:2px solid rgba(0,255,200,0.2);border-radius:14px;padding:16px 24px;text-align:center;transition:opacity 1.5s;pointer-events:none;z-index:15;max-width:310px}
#helpOverlay.hidden{opacity:0}
#helpOverlay .title{font-size:1.1rem;color:#0fc;font-weight:700;margin-bottom:6px}
#helpOverlay .hint{font-size:0.8rem;color:rgba(255,255,255,0.6);line-height:1.5}
#helpOverlay .arrow{font-size:2rem;display:block;margin:8px 0;animation:floatArrow 2s ease-in-out infinite}
@keyframes floatArrow{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Planet Info Card */
#planetInfo{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);max-width:320px;width:90vw;background:rgba(0,10,30,0.92);backdrop-filter:blur(12px);border:2px solid rgba(0,255,200,0.3);border-radius:16px;padding:16px;box-shadow:0 0 40px rgba(0,255,200,0.1);transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
#planetInfo.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#planetInfo .title{font-size:1.2rem;font-weight:700;color:#0fc;margin-bottom:4px}
#planetInfo .sub{font-size:0.75rem;color:rgba(255,255,255,0.5);margin-bottom:8px}
#planetInfo .desc{font-size:0.85rem;color:rgba(255,255,255,0.8);line-height:1.4;margin-bottom:8px}
#planetInfo .stats{display:flex;flex-wrap:wrap;gap:4px}
#planetInfo .stat{background:rgba(0,255,200,0.1);border:1px solid rgba(0,255,200,0.15);border-radius:6px;padding:3px 8px;font-size:0.7rem;color:rgba(255,255,255,0.6)}
#planetInfo .stat span{color:#0fc;font-weight:600}
#planetInfo .close{position:absolute;top:8px;right:10px;background:none;border:none;color:rgba(255,255,255,0.3);font-size:1.2rem;cursor:pointer;pointer-events:auto}
#planetInfo .close:hover{color:#fff}

/* Landing / Launch button */
#landBtn{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,200,255,0.15);backdrop-filter:blur(8px);border:2px solid rgba(0,255,200,0.4);border-radius:14px;padding:14px 28px;color:#0fc;font-size:1.1rem;font-weight:700;letter-spacing:0.05em;pointer-events:auto;z-index:15;opacity:0;transition:all 0.4s;cursor:pointer;white-space:nowrap}
#landBtn.show{opacity:1}
#landBtn:active{transform:translateX(-50%) scale(0.95)}
#landBtn.land{background:rgba(0,255,100,0.15);border-color:#0f6;color:#0f6}
#landBtn.launch{background:rgba(255,200,0,0.15);border-color:#fc0;color:#fc0}

/* Landing zone indicator */
#landingZone{position:absolute;pointer-events:none;z-index:9;border-radius:50%;border:2px dashed rgba(0,255,200,0.2);top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;animation:pulseRing 1.5s ease-in-out infinite;display:none}
#landingZone.show{display:block}
#landingZone.pulse{animation:pulseRing 1s ease-in-out infinite}
@keyframes pulseRing{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6}50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.2}}

/* Boost + Brake Buttons */
#btnRow{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;z-index:20}
#btnRow button{pointer-events:auto;border:none;border-radius:14px;font-size:0.85rem;font-weight:700;letter-spacing:0.05em;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.12s}
#btnRow button:active{transform:scale(0.92)}
#brakeBtn{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,100,50,0.3);background:rgba(40,10,0,0.8);backdrop-filter:blur(6px);color:#f84;font-size:1.6rem}
#brakeBtn:active,#brakeBtn.active{background:rgba(255,80,20,0.3);border-color:#f84}
#boostBtn{width:80px;height:80px;border-radius:50%;border:3px solid rgba(0,255,200,0.3);background:rgba(0,20,40,0.8);backdrop-filter:blur(6px);color:#0fc;font-size:1.6rem}
#boostBtn:active,#boostBtn.active{background:rgba(0,255,200,0.2);border-color:#0fc;box-shadow:0 0 30px rgba(0,255,200,0.4)}
#btnLabels{position:fixed;bottom:6px;left:16px;right:16px;display:flex;justify-content:space-between;color:rgba(255,255,255,0.2);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;pointer-events:none;z-index:20}
#btnLabels .l{text-align:left}
#btnLabels .r{text-align:right}

/* Touch indicator ring */
#touchRing{position:fixed;width:60px;height:60px;border:3px solid rgba(0,255,200,0.4);border-radius:50%;pointer-events:none;z-index:25;transform:translate(-50%,-50%);transition:opacity 0.3s;opacity:0}
#touchRing.show{opacity:1}
#touchRing .inner{position:absolute;top:50%;left:50%;width:12px;height:12px;background:rgba(0,255,200,0.6);border-radius:50%;transform:translate(-50%,-50%)}

/* Prograde / Retrograde Markers */
#progradeMarker{position:absolute;width:18px;height:18px;border:2px solid rgba(0,255,100,0.8);border-radius:50%;pointer-events:none;z-index:8;transform:translate(-50%,-50%);display:none}
#progradeMarker::after{content:'';position:absolute;top:50%;left:50%;width:10px;height:10px;background:rgba(0,255,100,0.6);border-radius:50%;transform:translate(-50%,-50%)}
#progradeMarker.show{display:block}
#retrogradeMarker{position:absolute;width:20px;height:20px;pointer-events:none;z-index:8;transform:translate(-50%,-50%);display:none}
#retrogradeMarker::before{content:'✕';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;color:rgba(255,80,50,0.8);font-weight:700}
#retrogradeMarker.show{display:block}

/* Relative velocity hint */
#relVelHint{position:absolute;top:68px;left:10px;background:rgba(0,10,30,0.85);backdrop-filter:blur(8px);border:1px solid rgba(0,255,200,0.15);border-radius:8px;padding:4px 10px;font-size:0.7rem;color:rgba(255,255,255,0.5);pointer-events:none;z-index:12;display:none;white-space:nowrap}
#relVelHint.show{display:block}
#relVelHint .val{color:#fc0;font-weight:600}
#relVelHint .icon{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* Landing state overlay */
#landedUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:12;opacity:0;transition:opacity 0.5s}
#landedUI.show{opacity:1}
#landedUI .planetName{font-size:1.8rem;color:#0fc;font-weight:700}
#landedUI .sub{font-size:0.9rem;color:rgba(255,255,255,0.5);margin-top:6px}
#landedUI .launchHint{font-size:0.8rem;color:rgba(255,200,0,0.6);margin-top:10px}

/* Sequence status overlay */
#seqStatus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,10,30,0.9);backdrop-filter:blur(8px);border:2px solid rgba(0,255,200,0.3);border-radius:12px;padding:10px 22px;color:#0fc;font-size:1.1rem;font-weight:700;text-align:center;pointer-events:none;z-index:16;opacity:0;transition:opacity 0.3s;letter-spacing:0.05em}
#seqStatus.show{opacity:1}

@media(max-width:768px){
  #boostBtn,#brakeBtn{width:70px;height:70px;font-size:1.3rem}
  #topBar{padding:6px}
  #location{font-size:0.7rem;padding:4px 10px}
  #speedometer{padding:4px 8px;min-width:60px}
  #speedometer .val{font-size:0.95rem}
  #minimap{width:100px;height:100px;top:6px;right:6px}
  #planetInfo{bottom:170px;padding:12px;max-width:280px}
  #helpOverlay{padding:12px 16px;max-width:260px}
  #helpOverlay .title{font-size:0.95rem}
  #helpOverlay .hint{font-size:0.75rem}
  #landedUI .planetName{font-size:1.4rem}
}
</style>
</head>
<body>

<div id="hud">
  <div id="topBar">
    <div id="location">
      <div class="name" id="locName">🚀 Im All</div>
      <div class="hint" id="nearHint">–</div>
    </div>
    <div id="speedometer">
      <div class="label">Geschw.</div>
      <div class="val" id="speedVal">0</div>
      <div class="unit">km/s</div>
    </div>
  </div>

  <div id="minimap" class="show"><canvas id="mapCanvas" width="140" height="140"></canvas></div>
  <div id="minimapLabel" class="show">RADAR</div>

  <div id="progradeMarker"></div>
  <div id="retrogradeMarker"></div>
  <div id="relVelHint"></div>

  <div id="helpOverlay">
    <div class="title">🚀 Fliegen</div>
    <div class="arrow">👆</div>
    <div class="hint">Finger auf Bildschirm & ziehen → fliegen<br>⛔ = Bremsen · ⚡ = Boost<br>🪐 Planet anfliegen & ⬇️ Landen drücken<br>🖱️ WASD + Maus · Shift=Boost · Space=Bremse</div>
  </div>

  <div id="landingZone"></div>

  <div id="planetInfo">
    <button class="close" onclick="closePlanetInfo()">✕</button>
    <div class="title" id="piTitle">🌍 Planet</div>
    <div class="sub" id="piSub">–</div>
    <div class="desc" id="piDesc">–</div>
    <div class="stats" id="piStats"></div>
  </div>

  <div id="seqStatus">⬇️ LANDUNG</div>

  <div id="landedUI">
    <div class="planetName" id="landPlanetName">🪐 Planet</div>
    <div class="sub">Gelandet! 🛸</div>
    <div class="launchHint">👆 🚀 Starten (Enter)</div>
  </div>
</div>

<button id="landBtn" onclick="doLandOrLaunch()">⬇️ Landen</button>

<div id="touchRing"><div class="inner"></div></div>

<div id="btnRow">
  <button id="brakeBtn" ontouchstart="brakeDown=true;event.preventDefault()" ontouchend="brakeDown=false;event.preventDefault()" onmousedown="brakeDown=true" onmouseup="brakeDown=false">⛔</button>
  <button id="boostBtn" ontouchstart="boostDown=true;event.preventDefault()" ontouchend="boostDown=false;event.preventDefault()" onmousedown="boostDown=true" onmouseup="boostDown=false">⚡</button>
</div>
<div id="btnLabels"><span class="l">⛔ Bremsen (Space)</span><span class="r">⚡ Boost (Shift)</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== CONFIG =====================
const CFG = {
  world: { asteroidCount: 200, starCount: 3000, nebulaCount: 8 },
  player: { thrust: 18, boostMultiplier: 3, brakePower: 50,
            maxSpeed: 45, maxBoostSpeed: 140,
            turnSensitivity: 0.014, maxPitch: 1.5, damping: 0.985 },
  camera: { fov: 70, near: 0.5, far: 5000, followSpeed: 0.07 },
  landing: { approachSpeed: 12, autoLandSpeed: 4, planetLandDist: 1.2,
    approachAltitude: 8, descentDuration: 3 },
  minimap: { radius: 55, range: 800, updateInterval: 3 }
};

// ===================== STATE =====================
const state = {
  pos: new THREE.Vector3(0, 8, 0),
  vel: new THREE.Vector3(0, 0, -6),
  yaw: 0, pitch: 0,
  speed: 0,
  landed: false, landedOn: null,
  nearPlanet: null, nearDist: Infinity,
  // Controls
  touchId: -1, touchActive: false,
  touchCX: 0, touchCY: 0,
  boostDown: false, brakeDown: false,
  frameCount: 0, mapFrame: 0,
  camDist: 4,
  autoApproach: false, approachTarget: null,
  // 3D Landing sequence state machine
  seqState: 0, // 0=idle, 1=approach, 2=descent, 3=flare/touchdown, 4=landed, 5=liftoff, 6=climb
  seqPlanet: null,
  seqTimer: 0,
  seqStartPos: null,
  seqLandingPos: null,
  seqEndPos: null,
  seqStartVel: null
};

// ===================== THREE SETUP =====================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CFG.camera.fov, window.innerWidth/window.innerHeight, CFG.camera.near, CFG.camera.far);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);
camera.position.set(0, 2, 6);

// ===================== STARS =====================
const starGeom = new THREE.BufferGeometry();
const sp = new Float32Array(CFG.world.starCount * 3);
const sc = new Float32Array(CFG.world.starCount * 3);
for(let i=0; i<CFG.world.starCount; i++){
  const theta = Math.random()*Math.PI*2, phi = Math.acos(Math.random()*2-1), r = 800+Math.random()*4000;
  sp[i*3]=r*Math.sin(phi)*Math.cos(theta); sp[i*3+1]=r*Math.sin(phi)*Math.sin(theta); sp[i*3+2]=r*Math.cos(phi);
  const c = 0.6+Math.random()*0.4; sc[i*3]=c; sc[i*3+1]=c; sc[i*3+2]=0.7+Math.random()*0.3;
}
starGeom.setAttribute('position', new THREE.BufferAttribute(sp,3));
starGeom.setAttribute('color', new THREE.BufferAttribute(sc,3));
scene.add(new THREE.Points(starGeom, new THREE.PointsMaterial({size:0.5,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false})));

// ===================== NEBULAE =====================
for(let n=0; n<CFG.world.nebulaCount; n++){
  const g=new THREE.BufferGeometry(), p=new Float32Array(600*3), c=new Float32Array(600*3);
  const hue=Math.random(),cx=(Math.random()-0.5)*2000,cy=(Math.random()-0.5)*2000,cz=(Math.random()-0.5)*2000,spread=200+Math.random()*400;
  for(let i=0; i<600; i++){
    p[i*3]=cx+(Math.random()-0.5)*spread;p[i*3+1]=cy+(Math.random()-0.5)*spread*0.5;p[i*3+2]=cz+(Math.random()-0.5)*spread;
    const rgb=new THREE.Color().setHSL(hue+(Math.random()-0.5)*0.2,0.6,0.12+Math.random()*0.12);
    c[i*3]=rgb.r;c[i*3+1]=rgb.g;c[i*3+2]=rgb.b;
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:6+Math.random()*12,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false})));
}

// ===================== PLANETS =====================
const planets = [];
const planetData = [
  { name:'Merkur', color:0xaaaaaa, size:1.5, dist:80, orbSpeed:0.008, desc:'Kleinster Planet, voller Krater. Tagsüber bis 430°C!', landColor:0x888888, terrainSeed: 12345, terrainScale: 0.08 },
  { name:'Venus', color:0xe6b85c, size:2.2, dist:130, orbSpeed:0.005, desc:'Heißester Planet! Giftige Wolken aus Schwefelsäure.', landColor:0xc8a050, terrainSeed: 23456, terrainScale: 0.05 },
  { name:'Erde', color:0x4488cc, size:2.5, dist:180, orbSpeed:0.003, desc:'Unser Zuhause! 71% Wasser, grüne Kontinente. 🌍', landColor:0x3366aa, terrainSeed: 34567, terrainScale: 0.06 },
  { name:'Mars', color:0xcc5533, size:1.8, dist:240, orbSpeed:0.002, desc:'Der Rote Planet. Höchster Berg: Olympus Mons!', landColor:0xaa4420, terrainSeed: 45678, terrainScale: 0.10 },
  { name:'Jupiter', color:0xccaa77, size:5, dist:350, orbSpeed:0.001, desc:'Größter Planet! 1300 Erden passen rein.', landColor:0xbb9955, terrainSeed: 56789, terrainScale: 0.03 },
  { name:'Saturn', color:0xeedd99, size:4, dist:480, orbSpeed:0.0007, desc:'Wunderschöne Ringe! Würde im Wasser schwimmen.', landColor:0xddcc88, terrainSeed: 67890, terrainScale: 0.04 }
];

// Procedural noise function for terrain
function seededRandom(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function noise2D(x, y, seed) {
  const nx = x * 0.1, ny = y * 0.1;
  const ix = Math.floor(nx), iy = Math.floor(ny);
  const fx = nx - ix, fy = ny - iy;
  
  const a = seededRandom(seed + ix * 12345 + iy * 67890);
  const b = seededRandom(seed + (ix+1) * 12345 + iy * 67890);
  const c = seededRandom(seed + ix * 12345 + (iy+1) * 67890);
  const d = seededRandom(seed + (ix+1) * 12345 + (iy+1) * 67890);
  
  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);
  
  return a * (1-u) * (1-v) + b * u * (1-v) + c * (1-u) * v + d * u * v;
}

function fbm(x, y, seed, octaves=5) {
  let value = 0, amplitude = 1, frequency = 1, maxValue = 0;
  for(let i=0; i<octaves; i++) {
    value += amplitude * noise2D(x * frequency, y * frequency, seed + i * 1000);
    maxValue += amplitude;
    amplitude *= 0.5;
    frequency *= 2;
  }
  return value / maxValue;
}

// Create terrain mesh with procedural displacement
function createPlanetTerrain(pd) {
  const radius = pd.size;
  const segments = 64; // Higher resolution for terrain
  const geom = new THREE.SphereGeometry(radius, segments, segments);
  const positions = geom.attributes.position;
  
  // Store original positions for raycasting
  const originalPositions = new Float32Array(positions.array.length);
  originalPositions.set(positions.array);
  geom.setAttribute('originalPosition', new THREE.BufferAttribute(originalPositions.slice(), 3));
  
  // Apply displacement
  for(let i=0; i<positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    
    // Convert to spherical coordinates
    const lat = Math.asin(y / radius);
    const lon = Math.atan2(z, x);
    
    // Sample noise at this position
    const h = fbm(lon * 10, lat * 10, pd.terrainSeed, 6);
    const displacement = h * pd.size * pd.terrainScale;
    
    // Displace along normal (which is just the normalized position for a sphere)
    const len = Math.sqrt(x*x + y*y + z*z);
    const nx = x / len, ny = y / len, nz = z / len;
    
    positions.setXYZ(i, x + nx * displacement, y + ny * displacement, z + nz * displacement);
  }
  
  geom.computeVertexNormals();
  geom.computeBoundingSphere();
  
  // Create material with terrain coloring based on height
  const terrainMaterial = new THREE.MeshPhongMaterial({
    color: pd.color,
    emissive: pd.color,
    emissiveIntensity: 0.05,
    shininess: 30,
    flatShading: true,
    vertexColors: true
  });
  
  // Add vertex colors based on height
  const colors = new Float32Array(positions.count * 3);
  const landColor = new THREE.Color(pd.landColor);
  const baseColor = new THREE.Color(pd.color);
  
  for(let i=0; i<positions.count; i++) {
    const origX = originalPositions[i*3];
    const origY = originalPositions[i*3+1];
    const origZ = originalPositions[i*3+2];
    const newX = positions.getX(i);
    const newY = positions.getY(i);
    const newZ = positions.getZ(i);
    
    const origLen = Math.sqrt(origX*origX + origY*origY + origZ*origZ);
    const newLen = Math.sqrt(newX*newX + newY*newY + newZ*newZ);
    const heightRatio = (newLen - origLen) / (pd.size * pd.terrainScale);
    
    // Mix between base and land color based on height
    let r, g, b;
    if (heightRatio > 0.3) {
      // High terrain - lighter
      r = landColor.r + (1 - landColor.r) * Math.min(1, (heightRatio - 0.3) * 2);
      g = landColor.g + (1 - landColor.g) * Math.min(1, (heightRatio - 0.3) * 2);
      b = landColor.b + (1 - landColor.b) * Math.min(1, (heightRatio - 0.3) * 2);
    } else if (heightRatio < -0.2) {
      // Low terrain - darker (valleys/craters)
      r = landColor.r * 0.6;
      g = landColor.g * 0.6;
      b = landColor.b * 0.6;
    } else {
      r = landColor.r;
      g = landColor.g;
      b = landColor.b;
    }
    colors[i*3] = r;
    colors[i*3+1] = g;
    colors[i*3+2] = b;
  }
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const mesh = new THREE.Mesh(geom, terrainMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  
  // Store terrain data for raycasting during landing
  mesh.userData.terrainData = {
    originalPositions: originalPositions,
    radius: radius,
    seed: pd.terrainSeed,
    scale: pd.terrainScale,
    landColor: pd.landColor
  };
  
  return mesh;
}

const dustCount = 60;

}

// Store for animation
const dustState = { positions: dustPos, velocities: dustVel, lifetimes: dustLife, count: dustCount, active: false };

function emitDustBurst(worldPos, count=30){
  dustParticles.visible = true;
  dustParticles.position.copy(worldPos);
  const pos = dustState.positions;
  const vel = dustState.velocities;
  const life = dustState.lifetimes;
  for(let i=0; i<count && i<dustCount; i++){
    pos[i*3] = (Math.random()-0.5)*0.5;
    pos[i*3+1] = (Math.random()-0.5)*0.2;
    pos[i*3+2] = (Math.random()-0.5)*0.5;
    vel[i*3] = (Math.random()-0.5)*2;
    vel[i*3+1] = Math.random()*3+1;
    vel[i*3+2] = (Math.random()-0.5)*2;
    life[i] = 0.5 + Math.random()*0.8;
  }
  dustParticles.geometry.attributes.position.needsUpdate = true;
}

function updateDust(delta){
  if(!dustParticles.visible) return;
  const pos = dustState.positions;
  const vel = dustState.velocities;
  const life = dustState.lifetimes;
  let anyAlive = false;
  for(let i=0; i<dustCount; i++){
    if(life[i] > 0){
      life[i] -= delta;
      pos[i*3] += vel[i*3]*delta;
      pos[i*3+1] += vel[i*3+1]*delta;
      pos[i*3+2] += vel[i*3+2]*delta;
      vel[i*3+1] -= 3*delta; // gravity
      if(life[i] > 0) anyAlive = true;
    }else{
      // Reset below ground
      if(!anyAlive && i === dustCount-1){
        pos[i*3] = 0; pos[i*3+1] = -100; pos[i*3+2] = 0;
      }
    }
  }
  dustParticles.geometry.attributes.position.needsUpdate = true;
  if(!anyAlive){
    dustParticles.visible = false;
    dustState.active = false;
  }
}

// ===================== LAND / LAUNCH SEQUENCE (3D) =====================
function doLandOrLaunch(){
  if(state.landed){ startLaunchSequence(); return; }
  if(state.seqState !== 0) return; // Bereits in Sequence
  if(state.autoApproach){
    cancelApproach();
    return;
  }
  let nearest=null,nearDist=Infinity;
  planets.forEach(p=>{const d=state.pos.distanceTo(p.group.position);if(d<nearDist){nearDist=d;nearest=p;}});
  if(!nearest) return;
  // Direkte Landesequenz starten, sobald nah genug (Größe + 40 Einheiten)
  startLandingSequence(nearest);
}

function startApproach(planet){
  state.autoApproach=true;
  state.approachTarget=planet;
  document.getElementById('nearHint').textContent=`🛰️ NAV: ${planet.data.name}`;
  document.getElementById('landBtn').textContent='✕ Abbrechen';
  document.getElementById('landBtn').className='show';
  document.getElementById('seqStatus').textContent=`🛰️ Anflug ${planet.data.name}`;
  document.getElementById('seqStatus').className='show';
}

function cancelApproach(){
  state.autoApproach=false;
  state.approachTarget=null;
  document.getElementById('nearHint').textContent='–';
  document.getElementById('seqStatus').className='';
  detectLandingState();
}

// ===================== 3D LANDING SEQUENCE (WITH REAL TERRAIN) =====================
function startLandingSequence(planet){
  if(!planet) return;
  state.autoApproach = false;
  state.approachTarget = null;

  document.getElementById('landBtn').classList.remove('show');
  document.getElementById('locName').textContent=`🛸 Landung ${planet.data.name}`;
  document.getElementById('seqStatus').textContent='⬇️ Sinkflug';
  document.getElementById('seqStatus').className='show';

  // Raycast gegen echtes Terrain-Mesh für echte Landeposition
  const terrainMesh = planet.mesh;
  const raycaster = new THREE.Raycaster();
  const dirFromShip = planet.group.position.clone().sub(state.pos).normalize();
  const rayOrigin = state.pos.clone();
  raycaster.set(rayOrigin, dirFromShip.negate()); // Ray from ship toward planet
  
  const intersects = raycaster.intersectObject(terrainMesh, true);
  let landingPos, landingNormal;
  
  if(intersects.length > 0) {
  // Landung auf echter Terrain-Oberfläche
  landingPos = intersects[0].point.clone();
  landingNormal = intersects[0].face ? intersects[0].face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(terrainMesh.matrixWorld)) : dirFromShip.clone();
  } else {
    // Fallback: Kugel-Oberfläche
    landingPos = planet.group.position.clone().add(dirFromShip.clone().multiplyScalar(planet.data.size + 0.15));
    landingNormal = dirFromShip.clone();
  }

  // STATE MACHINE direkt auf Descent setzen
  state.seqState = 2; // descent
  state.seqPlanet = planet;
  state.seqTimer = 0;
  state.seqStartPos = state.pos.clone();
  state.seqLandingPos = landingPos.clone();
  state.seqLandingNormal = landingNormal.clone();
  state.vel.set(0,0,0);
  state.speed = 0;

  // Pitch hochziehen (Nase nach oben) 
  state.pitch = 1.0;
  // Yaw auf Planet ausrichten
  const toPlanet = dirFromShip;
  state.yaw = Math.atan2(toPlanet.x, toPlanet.z);
}

function updateLandingSequence(delta){
  const p = state.seqPlanet;
  if(!p) return;
  state.seqTimer += delta;

  if(state.seqState === 2){
    // ======= DESCENT: Sanfter Sinkflug auf ECHTER Terrain-Oberfläche =======
    const duration = CFG.landing.descentDuration;
    const t = Math.min(1, state.seqTimer / duration);
    const st = t * t * (3 - 2 * t); // smoothstep

    // Verwende VORBERECHNETE echte Terrain-Landeposition und -Normale
    const landingPos = state.seqLandingPos.clone();
    const landingNormal = state.seqLandingNormal.clone();

    // Position interpolieren
    state.pos.lerpVectors(state.seqStartPos, landingPos, st);

    // Ship-Orientierung: Nase nach oben, aber an Terrain-Normale angepasst
    // Ziel: Schiff "steht" auf der Oberfläche (Up-Vektor = Terrain-Normale)
    const targetUp = landingNormal.clone();
    const targetForward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(state.pitch, state.yaw, 0, 'YXZ'));
    
    // Pitch hochziehen (Nase zeigt nach oben) & langsam zurücknehmen für Flare
    const pitchCurve = 1.0 - Math.min(0.8, t * t * 2.5);
    state.pitch += (pitchCurve * 1.2 - state.pitch) * 0.08;

    // Yaw leicht an Terrain anpassen (für Seitwärts-Neigung bei Hängen)
    state.yaw += Math.sin(state.seqTimer * 3) * 0.004;

    // Gear ausfahren bei ~50%
    if(st > 0.5 && !legGroup.visible){
      legGroup.visible = true;
      // Landing Gear an Terrain-Normale ausrichten
      legGroup.rotation.setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), landingNormal));
      document.getElementById('seqStatus').textContent='🦿 Fahrwerk';
      setTimeout(()=>{document.getElementById('seqStatus').textContent='⬇️ Landen';},400);
    }

    // Bei ~75% → Flare-Phase (Pitch flach + leicht absenken)
    if(st > 0.7){
      state.seqState = 3;
      state.seqTimer = 0;
      state.seqStartPos = state.pos.clone();
      document.getElementById('seqStatus').textContent='🔄 Abfangen';
    }

    // Distanz-Info (echte Höhe über Terrain)
    const dist = state.pos.distanceTo(p.group.position);
    const heightAboveTerrain = Math.max(0, dist - p.data.size);
    document.getElementById('nearHint').textContent=`🛸 ${Math.round(heightAboveTerrain * 1000)} m`;
  }
  else if(state.seqState === 3){
    // ======= FLARE + TOUCHDOWN auf ECHTEM Terrain =======
    const duration = 1.0;
    const t = Math.min(1, state.seqTimer / duration);
    const st = t * t * (3 - 2 * t);

    // Verwende VORBERECHNETE echte Terrain-Position
    const landingPos = state.seqLandingPos.clone();
    const landingNormal = state.seqLandingNormal.clone();

    state.pos.lerpVectors(state.seqStartPos, landingPos, st);

    // Pitch nach unten zur Horizontalen (relativ zur Terrain-Normale)
    state.pitch *= 0.9;
    if(Math.abs(state.pitch) < 0.05) state.pitch = 0;

    // Landing Gear an Terrain anpassen
    if(legGroup.visible) {
      legGroup.rotation.setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), landingNormal));
    }

    // Vibration kurz vor Touchdown
    if(st > 0.85){
      const vib = (1 - st) * 0.05;
      state.pos.x += (Math.random()-0.5) * vib;
      state.pos.y += (Math.random()-0.5) * vib;
      state.pos.z += (Math.random()-0.5) * vib;
    }

    // Distanz-Info (echte Höhe über Terrain)
    const dist = state.pos.distanceTo(p.group.position);
    const heightAboveTerrain = Math.max(0, dist - p.data.size);
    document.getElementById('nearHint').textContent=`🛸 ${Math.round(heightAboveTerrain * 1000)} m`;

    // Touchdown!
    if(t >= 1){
      // Exakte Touchdown-Position auf TERRAIN (nicht Kugel)
      state.pos.copy(landingPos);
      state.vel.set(0,0,0);
      state.speed = 0;

      // Landing-Gear fest an Terrain-Normale ausrichten
      legGroup.visible = true;
      legGroup.rotation.setFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), landingNormal));

      // Dust an Touchdown-Position
      const dustWorldPos = landingPos.clone().add(landingNormal.clone().multiplyScalar(-0.1));
      emitDustBurst(dustWorldPos, 45);

      // Landed setzen
      state.seqState = 4;
      state.landed = true;
      state.landedOn = p;

      // UI
      document.getElementById('landBtn').textContent='🚀 Starten (Enter)';
      document.getElementById('landBtn').className='show launch';
      document.getElementById('locName').textContent=`🛸 ${p.data.name}`;
      document.getElementById('landPlanetName').textContent=`🪐 ${p.data.name}`;
      document.getElementById('landedUI').classList.add('show');
      document.getElementById('landingZone').classList.remove('show');
      document.getElementById('seqStatus').textContent='✅ Gelandet!';
      document.getElementById('nearHint').textContent='–';
      setTimeout(()=>{document.getElementById('seqStatus').className='';},2000);
      closePlanetInfo();
    }
  }
}

// ===================== 3D LAUNCH SEQUENCE =====================
function startLaunchSequence(){
  if(!state.landed || !state.landedOn) return;

  state.seqState = 5; // liftoff
  state.seqPlanet = state.landedOn;
  state.seqTimer = 0;
  state.landed = false;

  const p = state.landedOn;
  state.seqStartPos = state.pos.clone();
  state.landedOn = null;

  // Endposition: etwas über der Oberfläche (entlang der Terrain-Normale), dann Wechsel zu Phase 6
  // Verwende die gespeicherte Terrain-Normale vom Landepunkt
  const upDir = state.seqLandingNormal.clone(); // Echte Terrain-Normale!
  state.seqEndPos = p.group.position.clone().add(upDir.clone().multiplyScalar(p.data.size + CFG.landing.approachAltitude));

  document.getElementById('landBtn').classList.remove('show','launch','land');
  document.getElementById('landedUI').classList.remove('show');
  document.getElementById('seqStatus').textContent='🚀 Start!';
  document.getElementById('seqStatus').className='show';
  document.getElementById('locName').textContent=`🚀 Start von ${p.data.name}`;

  // Gear einfahren
  legGroup.visible = false;

  // Dust beim Abheben an Terrain-Position
  const dustWorldPos = state.seqStartPos.clone().add(upDir.clone().multiplyScalar(-0.1));
  emitDustBurst(dustWorldPos, 35);
}

function updateLaunchSequence(delta){
  const p = state.seqPlanet;
  if(!p) return;
  state.seqTimer += delta;

  if(state.seqState === 5){
    // ======= LIFTOFF: Senkrechtstart aus der Atmosphäre =======
    const duration = 2.0;
    const t = Math.min(1, state.seqTimer / duration);
    const st = t * t; // ease-in

    // Nach oben fliegen
    state.pos.lerpVectors(state.seqStartPos, state.seqEndPos, st);

    // Pitch von 0 auf langsam schräg (fliegen weg)
    if(t > 0.3){
      state.pitch = (t - 0.3) * 0.4;
    }

    // Geschwindigkeit aufbauen
    const upDir = state.pos.clone().sub(p.group.position).normalize();
    state.vel.copy(upDir).multiplyScalar(8 + t * 20);

    // Flamme
    boostDown = true;

    document.getElementById('nearHint').textContent=`🚀 ${Math.round((1-st)*100)}% Schub`;

    if(t >= 1){
      // Genug Abstand – in den Orbit fliegen
      state.seqState = 6;
      state.seqTimer = 0;
      state.seqStartPos = state.pos.clone();
      // Zielrichtung: weg vom Planeten, aber mit Kurve
      const awayDir = state.pos.clone().sub(p.group.position).normalize();
      state.vel.copy(awayDir).multiplyScalar(15);
      document.getElementById('seqStatus').textContent='🚀 Orbit einnehmen';
    }
  }
  else if(state.seqState === 6){
    // ======= CLIMB: In den Orbit beschleunigen =======
    const duration = 1.5;
    const t = Math.min(1, state.seqTimer / duration);

    // Weiter beschleunigen
    const awayDir = state.pos.clone().sub(p.group.position).normalize();
    state.vel.lerp(new THREE.Vector3(awayDir.x * 25, Math.abs(awayDir.y * 15) + 12, awayDir.z * 25), 0.05);
    state.pos.add(state.vel.clone().multiplyScalar(delta));

    // Pitch langsam nach vorne
    state.pitch *= 0.95;
    state.speed = state.vel.length();

    if(t >= 1 && state.pos.distanceTo(p.group.position) > p.data.size + 20){
      // Launch fertig
      state.seqState = 0;
      state.seqPlanet = null;
      state.autoApproach = false;
      state.approachTarget = null;
      boostDown = false;
      document.getElementById('seqStatus').className='';
      document.getElementById('locName').textContent='🚀 Im All';
      document.getElementById('nearHint').textContent='–';
    }
  }
}

// ===================== UPDATE =====================
function update(delta){
  state.frameCount++;
  delta=Math.min(delta,0.05);

  // ===== LANDING/LAUNCH SEQUENCE ACTIVE? =====
  if(state.seqState >= 1 && state.seqState <= 3){
    updateLandingSequence(delta);
    updateDust(delta);
    // Ship vis update
    shipGroup.position.copy(state.pos);
    shipGroup.rotation.set(state.pitch,state.yaw,0);
    // Camera während Landing-Sequenz
    if(state.seqState === 1){
      // Während Approach: normale Chase-Cam
      const targetDist=4;
      state.camDist+=(targetDist-state.camDist)*0.08;
      const horizontalOnly=new THREE.Vector3(0,state.camDist*0.4,state.camDist);
      horizontalOnly.applyEuler(new THREE.Euler(0,state.yaw,0,'YXZ'));
      const camPos=state.pos.clone().add(horizontalOnly);
      camPos.y+=1.5+state.camDist*0.08;
      camera.position.lerp(camPos,0.15);
      const camLook=state.pos.clone().add(new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,state.yaw,0,'YXZ')).multiplyScalar(3));
      camera.lookAt(camLook);
    } else if(state.seqState === 2) {
      // Während Descent: Dynamische Verfolgungskamera hinter dem Schiff
      // Kamera folgt dem Schiff in einer leichten Distanz, blickt nach vorne/unten
      const camOffset = new THREE.Vector3(0, 1.2, 3.5);
      camOffset.applyEuler(new THREE.Euler(state.pitch, state.yaw, 0, 'YXZ'));
      const camPos = state.pos.clone().add(camOffset);
      camera.position.lerp(camPos, 0.1);
      const lookTarget = state.pos.clone().add(new THREE.Vector3(0, 0, -5).applyEuler(new THREE.Euler(state.pitch, state.yaw, 0, 'YXZ')));
      camera.lookAt(lookTarget);
    } else if(state.seqState === 3) {
      // Während Flare/Touchdown: Nahaufnahme, Fokus auf Terrain und Fahrwerk
      const landingNormal = state.seqLandingNormal.clone();
      const sideOffset = new THREE.Vector3(-landingNormal.z, 0, landingNormal.x).normalize().multiplyScalar(2);
      const camPos = state.pos.clone().add(landingNormal.clone().multiplyScalar(2.5)).add(sideOffset);
      camera.position.lerp(camPos, 0.1);
      camera.lookAt(state.pos.clone().add(landingNormal.clone().multiplyScalar(0.2)));
    }
    // HUD
    document.getElementById('speedVal').textContent=Math.round(state.speed*10)/10;
    // Kein normales Update während Sequence
    // (Planeten etc. weiterrotieren lassen)
    planets.forEach((p,idx)=>{p.angle+=p.orbSpeed*delta*30;
      p.group.position.x=p.dist*Math.cos(p.angle);p.group.position.z=p.dist*Math.sin(p.angle);
      p.group.children[0].rotation.y+=delta*0.5;
      if(p.group.children.length>1&&idx===5)p.group.children[1].rotation.z+=delta*0.3;
    });
    asteroids.forEach(a=>{a.rotation.x+=a.userData.rotSpeed.x;a.rotation.y+=a.userData.rotSpeed.y;a.rotation.z+=a.userData.rotSpeed.z;});
    sun.rotation.y+=delta*0.1;
    state.mapFrame++;
    if(state.mapFrame%CFG.minimap.updateInterval===0) drawMinimap();
    return; // Skip rest
  }

  // ===== LAUNCH SEQUENCE =====
  if(state.seqState >= 5){
    updateLaunchSequence(delta);
    updateDust(delta);
    shipGroup.position.copy(state.pos);
    shipGroup.rotation.set(state.pitch,state.yaw,0);
    // Camera
    const camPos=state.pos.clone().add(new THREE.Vector3(0.5,1.5,3));
    camera.position.lerp(camPos,0.15);
    camera.lookAt(state.pos);
    document.getElementById('speedVal').textContent=Math.round(state.speed*10)/10;
    planets.forEach((p,idx)=>{p.angle+=p.orbSpeed*delta*30;
      p.group.position.x=p.dist*Math.cos(p.angle);p.group.position.z=p.dist*Math.sin(p.angle);});
    state.mapFrame++;
    if(state.mapFrame%CFG.minimap.updateInterval===0) drawMinimap();
    return;
  }

  if(!state.landed){
    // ---------- AUTO-APPROACH (Autopilot) ----------
    if(state.autoApproach&&state.approachTarget){
      const target=state.approachTarget.group.position;
      const toTarget=target.clone().sub(state.pos);
      const dist=toTarget.length();
      // Force-Land bei extremer Nähe (starte 3D-Landing)
      if(dist<state.approachTarget.data.size+4){
        const landTarget=state.approachTarget;
        cancelApproach();
        startLandingSequence(landTarget);
        boostDown=false;brakeDown=false;
        return;
      }
      // Ziel-Yaw und -Pitch berechnen
      const targetYaw=-Math.atan2(toTarget.x,toTarget.z);
      const targetPitch=-Math.atan2(toTarget.y,Math.sqrt(toTarget.x*toTarget.x+toTarget.z*toTarget.z));
      // Smooth interpolieren (langsam für Kurskorrektur)
      let dy=targetYaw-state.yaw; while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
      state.yaw+=dy*0.5*delta;
      state.pitch+=(targetPitch-state.pitch)*0.3*delta;
      state.pitch=Math.max(-CFG.player.maxPitch,Math.min(CFG.player.maxPitch,state.pitch));
      // Speed anpassen: näher = langsamer
      const wantSpeed=Math.min(40,Math.max(2,dist*0.1));
      boostDown=state.speed<wantSpeed;
      brakeDown=state.speed>wantSpeed+1;
      // Distanz für HUD
      const pct=dist/(state.approachTarget.data.size+25);
      document.getElementById('nearHint').textContent=`🛰️ NAV: ${state.approachTarget.data.name} ⏎ ${Math.round(dist)} km ${pct<0.5?'🟢':'🟡'}`;
      // Autopilot-Schub/Bremse anwenden
      const forward=new THREE.Vector3(0,0,-1);
      forward.applyEuler(new THREE.Euler(state.pitch,state.yaw,0,'YXZ'));
      if(brakeDown){
        state.vel.add(forward.clone().multiplyScalar(-CFG.player.brakePower*delta*2));
        state.vel.multiplyScalar(0.9);
      }else{
        const thrust=CFG.player.thrust;
        const maxSpd=Math.min(40,wantSpeed+3);
        state.vel.add(forward.clone().multiplyScalar(thrust*delta));
        state.vel.multiplyScalar(0.98);
        if(state.vel.length()>maxSpd) state.vel.setLength(maxSpd);
      }
      state.pos.add(state.vel.clone().multiplyScalar(delta));
      shipGroup.position.copy(state.pos);
      shipGroup.rotation.set(state.pitch,state.yaw,0);
      state.speed=state.vel.length();
      // Automatisch Landung starten wenn nah genug & langsam genug
      if(dist<state.approachTarget.data.size+25&&state.speed<CFG.landing.approachSpeed){
        const landTarget=state.approachTarget;
        cancelApproach();
        startLandingSequence(landTarget);
        boostDown=false;brakeDown=false;
        return;
      }
    }else{
      // Manual steering (Touch / WASD) - kein Autopilot
      if(state.touchActive){
        state.yaw-=state.touchCX*CFG.player.turnSensitivity*delta*60;
        state.pitch=Math.max(-CFG.player.maxPitch,Math.min(CFG.player.maxPitch,
          state.pitch+state.touchCY*CFG.player.turnSensitivity*delta*60));
      }
      if(keys['a']||keys['arrowleft']) state.yaw+=CFG.player.turnSensitivity*delta*50;
      if(keys['d']||keys['arrowright']) state.yaw-=CFG.player.turnSensitivity*delta*50;
      if(keys['w']||keys['arrowup']) state.pitch=Math.max(-CFG.player.maxPitch,state.pitch-CFG.player.turnSensitivity*delta*50);
      if(keys['s']||keys['arrowdown']) state.pitch=Math.min(CFG.player.maxPitch,state.pitch+CFG.player.turnSensitivity*delta*50);

      const boosting=boostDown,braking=brakeDown;
      const forward=new THREE.Vector3(0,0,-1);
      forward.applyEuler(new THREE.Euler(state.pitch,state.yaw,0,'YXZ'));
      if(braking){
        state.vel.add(forward.clone().multiplyScalar(-CFG.player.brakePower*delta));
        state.vel.multiplyScalar(0.94);
      }else{
        const thrust=boosting?CFG.player.thrust*CFG.player.boostMultiplier:CFG.player.thrust;
        const maxSpd=boosting?CFG.player.maxBoostSpeed:CFG.player.maxSpeed;
        state.vel.add(forward.clone().multiplyScalar(thrust*delta));
        state.vel.multiplyScalar(CFG.player.damping);
        if(state.vel.length()>maxSpd) state.vel.setLength(maxSpd);
      }
      state.pos.add(state.vel.clone().multiplyScalar(delta));
      shipGroup.position.copy(state.pos);
      shipGroup.rotation.set(state.pitch,state.yaw,0);
      state.speed=state.vel.length();
    }
    detectLandingState();
  }

  // Camera - Chase Mode: nur Yaw folgen, Pitch ignorieren → Schiff bleibt stabil
  // Gelandet: Kamera um das Schiff auf der Planetenoberfläche
  if(state.landed&&state.landedOn){
    const p = state.landedOn;
    // Raycast für aktuelle Terrain-Normale unter dem Schiff
    const raycaster = new THREE.Raycaster();
    const downDir = state.pos.clone().sub(p.group.position).normalize().negate();
    raycaster.set(state.pos.clone().add(new THREE.Vector3(0, 10, 0)), downDir);
    const intersects = raycaster.intersectObject(p.mesh, true);
    
    let terrainNormal = state.pos.clone().sub(p.group.position).normalize(); // Fallback
    if(intersects.length > 0) {
      const face = intersects[0].face;
      if(face) {
        terrainNormal = face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(p.mesh.matrixWorld));
      }
    }
    
    // Kamera positioniert sich seitlich/oben relativ zur Terrain-Normale
    const sideOffset = new THREE.Vector3(-terrainNormal.z, 0, terrainNormal.x).normalize().multiplyScalar(4);
    const camTarget = state.pos.clone().add(terrainNormal.clone().multiplyScalar(2.5)).add(sideOffset);
    camTarget.y += 1.5;
    camera.position.lerp(camTarget, 0.12);
    camera.lookAt(state.pos.clone().add(terrainNormal.clone().multiplyScalar(0.5)));
  }else{
    // Smooth distance
    const targetDist=Math.max(3.5,Math.min(6.5,5-state.speed/50));
    state.camDist+=(targetDist-state.camDist)*0.08;
    // Horizontal: nur Yaw, kein Pitch → kein "Schiff dreht sich" beim Pitchen
    const horizontalOnly=new THREE.Vector3(0,state.camDist*0.4,state.camDist);
    horizontalOnly.applyEuler(new THREE.Euler(0,state.yaw,0,'YXZ'));
    const camPos=state.pos.clone().add(horizontalOnly);
    // Leichtes Hochziehen: Kamera etwas über dem Schiff
    camPos.y+=1.5+state.camDist*0.08;
    camera.position.lerp(camPos,CFG.camera.followSpeed*delta*30);
    // LookAt: etwas voraus (Lead-Target) für besseres Gefühl
    const leadDir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,state.yaw,0,'YXZ'));
    const lookTarget=state.pos.clone().add(leadDir.multiplyScalar(5));
    lookTarget.y+=0.3;
    camera.lookAt(lookTarget);
  }

  // Update planets
  planets.forEach((p,idx)=>{p.angle+=p.orbSpeed*delta*30;
    p.group.position.x=p.dist*Math.cos(p.angle);p.group.position.z=p.dist*Math.sin(p.angle);
    p.group.children[0].rotation.y+=delta*0.5;
    if(p.group.children.length>1&&idx===5)p.group.children[1].rotation.z+=delta*0.3;
  });
  asteroids.forEach(a=>{a.rotation.x+=a.userData.rotSpeed.x;a.rotation.y+=a.userData.rotSpeed.y;a.rotation.z+=a.userData.rotSpeed.z;});
  sun.rotation.y+=delta*0.1;

  // Flames
  const isBoosting=boostDown,speedNorm=state.landed?0:Math.min(1,state.speed/20);
  const flameI=state.landed?0.15:(isBoosting?1.0:0.2+speedNorm*0.8);
  flameCore.material.opacity=flameI*0.9;flameMid.material.opacity=flameI*0.7;flameOuter.material.opacity=flameI*0.4;
  const flameLen=state.landed?0.5:(isBoosting?2.5:0.8+speedNorm*1.2);
  flameCore.scale.set(1,flameLen,1);flameMid.scale.set(1,flameLen*0.9,1);flameOuter.scale.set(1,flameLen*0.8,1);
  const bt=isBoosting?1:0.2;
  flameCore.material.color.setHSL(0.10-bt*0.08,1,0.5+bt*0.5);
  flameMid.material.color.setHSL(0.08,1,0.4+bt*0.2);
  flameOuter.material.color.setHSL(0.04,1,0.2+bt*0.1);
  flameGroup.children.forEach(c=>{if(c.userData&&c.userData.side!==undefined)c.material.opacity=flameI*(0.3+Math.sin(state.frameCount*0.3+c.userData.side*2)*0.2);});
  if(brakeDown&&!state.landed){shipLight.color.setHex(0xff4400);shipLight.intensity=1.0;}
  else{shipLight.color.setHex(0x00ccff);shipLight.intensity=0.3+speedNorm*0.5;}

  // HUD
  document.getElementById('speedVal').textContent=Math.round(state.speed*10)/10;
  if(state.frameCount>480) document.getElementById('helpOverlay').classList.add('hidden');

  // Minimap update every 3 frames
  state.mapFrame++;
  if(state.mapFrame%CFG.minimap.updateInterval===0) drawMinimap();

  // Prograde / Retrograde Marker + Relativgeschwindigkeit
  if(!state.landed&&state.speed>0.5){
    // Prograde = velocity direction, Retrograde = -velocity direction
    const velDir=state.vel.clone().normalize();
    const retroDir=velDir.clone().negate();

    // Project to screen
    const progWorld=state.pos.clone().add(velDir.multiplyScalar(30));
    const retroWorld=state.pos.clone().add(retroDir.multiplyScalar(30));

    const progScreen=progWorld.clone().project(camera);
    const retroScreen=retroWorld.clone().project(camera);

    const pm=document.getElementById('progradeMarker');
    const rm=document.getElementById('retrogradeMarker');

    const sx=s=>Math.round((s.x*0.5+0.5)*window.innerWidth);
    const sy=s=>Math.round((-s.y*0.5+0.5)*window.innerHeight);

    if(progScreen.z<1){
      pm.classList.add('show');pm.style.left=sx(progScreen)+'px';pm.style.top=sy(progScreen)+'px';
    }else pm.classList.remove('show');

    if(retroScreen.z<1){
      rm.classList.add('show');rm.style.left=sx(retroScreen)+'px';rm.style.top=sy(retroScreen)+'px';
    }else rm.classList.remove('show');

    // Relative velocity to nearest planet
    const rvHint=document.getElementById('relVelHint');
    if(state.nearPlanet&&state.nearDist<state.nearPlanet.data.size+60){
      const toPlanet=state.nearPlanet.group.position.clone().sub(state.pos);
      const radialVel=state.vel.dot(toPlanet.normalize());
      const closing=radialVel<0;
      rvHint.innerHTML=`<span class="icon" style="background:${closing?'#0f0':'#ff0'}"></span>Relativ: <span class="val">${Math.abs(radialVel).toFixed(1)}</span> km/s ${closing?'⏎ nähernd':'↗ entfernend'}`;
      rvHint.classList.add('show');
    }else{
      rvHint.classList.remove('show');
    }
  }else{
    document.getElementById('progradeMarker').classList.remove('show');
    document.getElementById('retrogradeMarker').classList.remove('show');
    document.getElementById('relVelHint').classList.remove('show');
  }
}

// ===================== LANDING STATE =====================
function detectLandingState(){
  if(state.landed) return;
  let nearest=null,nearDist=Infinity;
  planets.forEach(p=>{const d=state.pos.distanceTo(p.group.position);if(d<nearDist){nearDist=d;nearest=p;}});
  state.nearPlanet=nearest;state.nearDist=nearDist;

  const landBtn=document.getElementById('landBtn');
  const lz=document.getElementById('landingZone');

  // Button immer zeigen, sobald ein Planet in Sichtweite (< 60 Einheiten)
  if(nearest && nearDist < nearest.data.size + 60){
    // PlanetInfo bei ausreichender Nähe
    if(nearDist < nearest.data.size + 14) showPlanetInfo(nearest);

    // Immer "Landen"-Button → startLandingSequence macht den Rest
    landBtn.textContent=`⬇️ Landen (${nearest.data.name}) [L]`;
    landBtn.className='show land';

    // Lande-Zone-Fadenkreuz zeigen wenn nah genug
    if(nearDist < nearest.data.size + 30){
      const planetScreenPos = nearest.group.position.clone().project(camera);
      const sx = (planetScreenPos.x*0.5+0.5)*window.innerWidth;
      const sy = (-planetScreenPos.y*0.5+0.5)*window.innerHeight;
      if(planetScreenPos.z<1){
        lz.classList.add('show');
        lz.style.left=sx+'px'; lz.style.top=sy+'px';
      } else lz.classList.remove('show');
    } else lz.classList.remove('show');

    // Auto-Land wenn extrem nah & langsam
    if(nearDist < nearest.data.size + 3.5 && state.speed < CFG.landing.autoLandSpeed && !state.touchActive){
      startLandingSequence(nearest);
      return;
    }

    document.getElementById('nearHint').textContent=`🪐 ${nearest.data.name} (${Math.round(nearDist)} km)`;
    document.getElementById('locName').textContent=`🚀 ➔ ${nearest.data.name}`;
  } else {
    landBtn.classList.remove('show','land','launch');
    lz.classList.remove('show');
    document.getElementById('nearHint').textContent='–';
    if(!state.landed) document.getElementById('locName').textContent='🚀 Im All';
    closePlanetInfo();
  }
}

// ===================== MINIMAP =====================
function drawMinimap(){
  const canvas=document.getElementById('mapCanvas');
  const ctx=canvas.getContext('2d');
  const R=CFG.minimap.radius, cx=70, cy=70, range=CFG.minimap.range;

  ctx.clearRect(0,0,140,140);

  // Background circle
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle='rgba(0,20,40,0.3)'; ctx.fill();
  ctx.strokeStyle='rgba(0,255,200,0.2)'; ctx.lineWidth=1.5; ctx.stroke();

  // Range rings
  [0.33,0.66].forEach(f=>{
    ctx.beginPath(); ctx.arc(cx,cy,R*f,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,255,200,0.06)'; ctx.lineWidth=1; ctx.stroke();
  });

  // Crosshair
  ctx.strokeStyle='rgba(0,255,200,0.05)'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(cx-R,cy); ctx.lineTo(cx+R,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-R); ctx.lineTo(cx,cy+R); ctx.stroke();

  // Draw planets
  planets.forEach(p=>{
    const dx=p.group.position.x-state.pos.x;
    const dz=p.group.position.z-state.pos.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>range) return;
    const scale=dist/range;
    const px=cx+dx/range*R;
    const py=cy+dz/range*R;
    const size=Math.max(3,p.data.size*2);
    ctx.beginPath(); ctx.arc(px,py,size,0,Math.PI*2);
    const col=new THREE.Color(p.data.color);
    ctx.fillStyle=`rgb(${col.r*255|0},${col.g*255|0},${col.b*255|0})`;
    ctx.fill();
    ctx.strokeStyle='rgba(0,255,200,0.4)'; ctx.lineWidth=1; ctx.stroke();
    // Label
    ctx.fillStyle='rgba(0,255,200,0.7)'; ctx.font='7px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.data.name,px,py+size+9);
  });

  // Draw nearest asteroid (up to 3)
  asteroids.sort((a,b)=>state.pos.distanceTo(a.position)-state.pos.distanceTo(b.position));
  for(let i=0;i<3&&i<asteroids.length;i++){
    const a=asteroids[i];const d=state.pos.distanceTo(a.position);
    if(d>range) continue;
    const dx=a.position.x-state.pos.x, dz=a.position.z-state.pos.z;
    const px=cx+dx/range*R, py=cy+dz/range*R;
    ctx.beginPath(); ctx.arc(px,py,1.5,0,Math.PI*2);
    ctx.fillStyle='rgba(150,150,150,0.4)'; ctx.fill();
  }

  // Sun (always visible at edges)
  const sdx=-state.pos.x, sdz=-state.pos.z, sdist=Math.sqrt(sdx*sdx+sdz*sdz);
  if(sdist>range){
    const angle=Math.atan2(sdz,sdx);
    const px=cx+Math.cos(angle)*(R-5), py=cy+Math.sin(angle)*(R-5);
    ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,200,50,0.8)'; ctx.fill();
    ctx.fillStyle='rgba(255,200,50,0.5)'; ctx.font='6px sans-serif'; ctx.textAlign='center';
    ctx.fillText('☀️',px,py+12);
  } else {
    const px=cx+sdx/range*R, py=cy+sdz/range*R;
    ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,200,50,0.6)'; ctx.fill();
  }

  // Player ship (center)
  ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fillStyle='#0fc'; ctx.fill();
  ctx.strokeStyle='rgba(0,255,200,0.3)'; ctx.lineWidth=1; ctx.stroke();

  // Direction indicator (triangle)
  const dirAngle = -state.yaw;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(dirAngle);
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(-4,4); ctx.lineTo(4,4); ctx.closePath();
  ctx.fillStyle='rgba(0,255,200,0.5)'; ctx.fill();
  ctx.restore();

  // Text: scale + north
  ctx.fillStyle='rgba(0,255,200,0.15)'; ctx.font='6px sans-serif'; ctx.textAlign='center';
  ctx.fillText(`${range}km`,cx,R-4);
}

// ===================== PLANET INFO =====================
function showPlanetInfo(p){
  const pi=document.getElementById('planetInfo');
  document.getElementById('piTitle').textContent=`🪐 ${p.data.name}`;
  document.getElementById('piSub').textContent=`Planet · ${(state.pos.distanceTo(p.group.position)).toFixed(0)} km entfernt`;
  document.getElementById('piDesc').textContent=p.data.desc;
  document.getElementById('piStats').innerHTML=`
    <div class="stat">Größe: <span>${p.data.size.toFixed(1)}</span></div>
    <div class="stat">Bahn: <span>${p.data.dist} AE</span></div>
    <div class="stat">Geschw.: <span>${(p.orbSpeed*1000).toFixed(0)} km/s</span></div>`;
  pi.classList.add('open');
}
function closePlanetInfo(){document.getElementById('planetInfo').classList.remove('open');}

// ===================== RESIZE =====================
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ===================== GAME LOOP =====================
let lastTime=0;
function animate(time){
  const delta=(time-lastTime)/1000;lastTime=time;
  update(delta);renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate(0);

// ===================== WAKE LOCK =====================
if(navigator.wakeLock){let wl;
  (async()=>{try{wl=await navigator.wakeLock.request('screen');}catch(e){}})();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wl)wl.release().then(()=>{}).catch(()=>{});});
}
