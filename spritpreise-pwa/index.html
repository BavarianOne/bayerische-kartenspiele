<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpritAlarm">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Spritpreise Alarm</title>
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">⛽ SpritAlarm</h1>
    </div>
    <div class="header-center">
      <div class="location-selector" id="locationSelector">
        <span class="location-icon">📍</span>
        <span class="location-name" id="locationName">Landshut/Ergolding</span>
        <span class="location-chevron">▼</span>
      </div>
    </div>
    <div class="header-right">
          <button class="icon-btn" id="refreshBtn" aria-label="Preise aktualisieren">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span class="badge" id="updateBadge" hidden>!</span>
          </button>
          <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Last Updated Display -->
      <div class="last-updated-bar" id="lastUpdatedBar" style="display: none;">
        <span id="lastUpdatedDisplay" style="font-size: 0.7rem; color: #888;"></span>
      </div>

  <!-- Fuel Type Tabs -->
  <nav class="fuel-tabs" role="tablist" aria-label="Kraftstoffart wählen">
    <button class="fuel-tab active" role="tab" aria-selected="true" data-fuel="3" aria-controls="panel-diesel">
      <span class="fuel-icon">🛢️</span>
      <span class="fuel-name">Diesel</span>
      <span class="fuel-price" id="dieselAvg">–</span>
    </button>
    <button class="fuel-tab" role="tab" aria-selected="false" data-fuel="5" aria-controls="panel-e10">
      <span class="fuel-icon">🚗</span>
      <span class="fuel-name">E10</span>
      <span class="fuel-price" id="e10Avg">–</span>
    </button>
    <button class="fuel-tab" role="tab" aria-selected="false" data-fuel="7" aria-controls="panel-e5">
      <span class="fuel-icon">⛽</span>
      <span class="fuel-name">E5</span>
      <span class="fuel-price" id="e5Avg">–</span>
    </button>
  </nav>

  <!-- Tab Panels -->
  <main class="app-main" role="tabpanel">
    <!-- List View -->
    <section class="tab-panel active" id="panel-list" role="tabpanel" aria-label="Listenansicht">
      <div class="filter-bar">
        <select id="sortSelect" aria-label="Sortierung">
          <option value="price">Preis (günstig zuerst)</option>
          <option value="distance">Entfernung (nah zuerst)</option>
          <option value="name">Name (A-Z)</option>
        </select>
        <label class="toggle-switch" id="favoritesOnly">
          <input type="checkbox" id="favOnlyCheck">
          <span class="slider"></span>
          <span>Nur Favoriten</span>
        </label>
      </div>
      <ul class="station-list" id="stationList" role="list" aria-live="polite">
        <!-- Stations injected here -->
      </ul>
      <div class="empty-state" id="emptyState" hidden>
        <p>🔍 Keine Tankstellen gefunden</p>
        <button class="btn-primary" id="retryLoad">Erneut laden</button>
      </div>
    </section>

    <!-- Map View -->
    <section class="tab-panel" id="panel-map" role="tabpanel" aria-label="Kartenansicht">
      <div id="map" class="map-container" aria-label="Karte mit Tankstellen"></div>
      <div class="map-controls">
        <button class="btn-secondary" id="locateMeBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path>
          </svg>
          Mein Standort
        </button>
        <button class="btn-secondary" id="fitBoundsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <path d="M12 4v4M12 16v4M4 12h4M16 12h4"></path>
          </svg>
          Alle anzeigen
        </button>
      </div>
    </section>

    <!-- Stats View -->
    <section class="tab-panel" id="panel-stats" role="tabpanel" aria-label="Statistiken">
      <div class="stats-grid" id="statsGrid">
        <!-- Stats cards injected here -->
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Hauptnavigation">
    <button class="nav-item active" data-view="list" aria-label="Liste">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span>Liste</span>
    </button>
    <button class="nav-item" data-view="map" aria-label="Karte">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        <line x1="8" y1="2" x2="8" y2="18"></line>
        <line x1="16" y1="6" x2="16" y2="22"></line>
      </svg>
      <span>Karte</span>
    </button>
    <button class="nav-item" data-view="stats" aria-label="Statistiken">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="16"></line>
      </svg>
      <span>Stats</span>
    </button>
    <button class="nav-item" data-view="alarms" aria-label="Alarme">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 6v6l4 2"></path>
      </svg>
      <span>Alarme</span>
      <span class="nav-badge" id="alarmBadge" hidden>0</span>
    </button>
  </nav>

  <!-- Settings Modal -->
  <dialog class="modal" id="settingsModal">
    <form method="dialog">
      <header class="modal-header">
        <h2>⚙️ Einstellungen</h2>
        <button class="icon-btn" value="cancel" aria-label="Schließen">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <div class="modal-body">
        <section class="settings-section">
          <h3>📍 Standort</h3>
          <div class="setting-item">
            <label for="latInput">Breitengrad</label>
            <input type="number" step="any" id="latInput" placeholder="z.B. 48.5398">
          </div>
          <div class="setting-item">
            <label for="lonInput">Längengrad</label>
            <input type="number" step="any" id="lonInput" placeholder="z.B. 12.1462">
          </div>
          <div class="setting-item">
            <label for="radiusInput">Suchradius (km)</label>
            <input type="number" min="1" max="50" id="radiusInput" value="5">
          </div>
          <button class="btn-secondary" id="useCurrentLocation">📍 Aktuellen Standort nutzen</button>
        </section>

        <section class="settings-section">
          <h3>🔔 Preis-Alarme</h3>
          <div class="setting-item">
            <label class="toggle-switch">
              <input type="checkbox" id="alarmsEnabled" checked>
              <span class="slider"></span>
              <span>Alarme aktivieren</span>
            </label>
          </div>
          <div class="setting-item">
            <label for="priceDropThreshold">Preisverfall (%) für Alarm</label>
            <input type="number" min="0.1" max="10" step="0.1" id="priceDropThreshold" value="2">
          </div>
          <div class="setting-item">
            <label for="absoluteThreshold">Absoluter Preis-Limit (€)</label>
            <input type="number" step="0.01" id="absoluteThreshold" placeholder="z.B. 1.80">
          </div>
          <div class="setting-item">
            <label class="toggle-switch">
              <input type="checkbox" id="notifyOnlyFavorites">
              <span class="slider"></span>
              <span>Nur bei Favoriten alarmieren</span>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>🔄 Automatische Updates</h3>
          <div class="setting-item">
            <label class="toggle-switch">
              <input type="checkbox" id="autoUpdateEnabled" checked>
              <span class="slider"></span>
              <span>Auto-Update alle 30 Min</span>
            </label>
          </div>
          <div class="setting-item">
            <label>Nicht aktualisieren (Nacht):</label>
            <div class="time-range">
              <input type="time" id="nightStart" value="22:00">
              <span>–</span>
              <input type="time" id="nightEnd" value="06:00">
            </div>
          </div>
          <div class="setting-item">
            <label class="toggle-switch">
              <input type="checkbox" id="wifiOnly" checked>
              <span class="slider"></span>
              <span>Nur bei WLAN aktualisieren</span>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>🎨 Darstellung</h3>
          <div class="setting-item">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect">
              <option value="dark">Dunkel</option>
              <option value="light">Hell</option>
              <option value="auto">System</option>
            </select>
          </div>
          <div class="setting-item">
            <label class="toggle-switch">
              <input type="checkbox" id="showDistance" checked>
              <span class="slider"></span>
              <span>Entfernung anzeigen</span>
            </label>
          </div>
          <div class="setting-item">
            <label class="toggle-switch">
              <input type="checkbox" id="showPriceHistory" checked>
              <span class="slider"></span>
              <span>Preisverlauf anzeigen</span>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>📊 Daten</h3>
          <button class="btn-danger" id="clearDataBtn">🗑️ Alle lokalen Daten löschen</button>
          <button class="btn-secondary" id="exportDataBtn">📤 Daten exportieren</button>
          <button class="btn-secondary" id="importDataBtn">📥 Daten importieren</button>
          <input type="file" id="importFile" accept=".json" hidden>
        </section>
      </div>
      <footer class="modal-footer">
        <button class="btn-primary" value="default">Speichern</button>
      </footer>
    </form>
  </dialog>

  <!-- Alarm Detail Modal -->
  <dialog class="modal" id="alarmModal">
    <form method="dialog">
      <header class="modal-header">
        <h2 id="alarmModalTitle">🔔 Preis-Alarm</h2>
        <button class="icon-btn" value="cancel" aria-label="Schließen">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <div class="modal-body" id="alarmModalBody">
        <!-- Alarm details injected here -->
      </div>
      <footer class="modal-footer">
        <button class="btn-secondary" value="cancel">OK</button>
      </footer>
    </form>
  </dialog>

  <!-- Station Detail Modal -->
  <dialog class="modal" id="stationModal">
    <form method="dialog">
      <header class="modal-header">
        <h2 id="stationModalTitle">⛽ Tankstelle</h2>
        <button class="icon-btn" value="cancel" aria-label="Schließen">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <div class="modal-body" id="stationModalBody">
        <!-- Station details injected here -->
      </div>
      <footer class="modal-footer">
        <button class="btn-primary" id="navigateBtn">🧭 Navigieren</button>
        <button class="btn-secondary" value="cancel">Schließen</button>
      </footer>
    </form>
  </dialog>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Update Banner -->
  <div class="update-banner" id="updateBanner" hidden>
    <span>🔄 Neue Version verfügbar</span>
    <button class="btn-primary" id="updateBtn">Aktualisieren</button>
  </div>

  <!-- Scripts -->
  <script src="js/idb.js"></script>
  <script src="js/clever-tanken.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>

  <!-- Leaflet for Map (loaded dynamically) -->
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" onload="this.rel='stylesheet'">
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" as="script">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
