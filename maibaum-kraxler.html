<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bayerischer Maibaum-Kraxler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #87CEEB; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none; text-align: center; }
    #score, #highscore { color: #3d2817; text-shadow: 2px 2px 0 #fff8e7; }
    #score { font-size: 24px; font-weight: bold; }
    #highscore { font-size: 16px; color: #8b4513; }
    #btn-restart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 12px 28px; font-size: 18px; background: #8b4513; color: #fff8e7; border: 3px solid #5c2e0c; border-radius: 8px; cursor: pointer; display: none; }
    #btn-restart:active { transform: translateX(-50%) translateY(2px); }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 30; }
    #overlay.hidden { display: none; }
    .card { background: #fff8e7; border: 4px solid #8b4513; border-radius: 16px; padding: 30px; text-align: center; max-width: 90%; }
    .card h1 { color: #8b4513; font-size: 26px; margin-bottom: 10px; }
    .card p { color: #3d2817; font-size: 16px; margin: 8px 0; }
    .btn { background: #8b4513; color: #fff8e7; border: none; padding: 14px 28px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 16px; }
    .btn:active { transform: translateY(2px); }
    #touch-controls { position: fixed; bottom: 24px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 24px; z-index: 15; pointer-events: none; }
    #touch-controls button { pointer-events: auto; width: 80px; height: 80px; border-radius: 50%; border: 3px solid #8b4513; background: rgba(255,248,231,0.92); font-size: 30px; color: #3d2817; box-shadow: 0 4px 0 #5c2e0c; }
    @media (pointer: coarse) { #touch-controls { display: flex; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="highscore">BEST: 0</div>
  </div>
  <button id="btn-restart">NEU STARTEN</button>
  <div id="touch-controls">
    <button id="btn-left" aria-label="Links">◀</button>
    <button id="btn-right" aria-label="Rechts">▶</button>
  </div>
  <div id="overlay">
    <div class="card">
      <h1>🌲 Maibaum-Kraxler 🌲</h1>
      <p>Klettere den Maibaum hoch!</p>
      <p>Weiche Bändern, Kuckuck & Seife aus.</p>
      <p>Sammle Brezn & Maßkrüge.</p>
      <button class="btn" id="btn-start">LOS GEHT'S</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="maibaum-kraxler-game.js"></script>
</body>
</html>
