name: Update Spritpreise

on:
  schedule:
    # alle 30 Minuten, 07:00-20:30 MESZ = 05:00-18:30 UTC
    - cron: "*/30 5-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Fetch fuel prices
        run: python .github/workflows/fetch_prices.py

      - name: Generate landshut-spritpreise.html
        run: python generate_landshut_spritpreise.py

      - name: Commit and push
        run: |
          git config user.name "spritalarm-bot"
          git config user.email "spritalarm@users.noreply.github.com"
          
          git add data/prices.json data/history.json landshut-spritpreise.html
          git commit -m "chore: update sprit prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger GitHub Pages deploy
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          echo "Triggering Pages deployment via API..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"master"}'
          echo "Pages deployment triggered!"