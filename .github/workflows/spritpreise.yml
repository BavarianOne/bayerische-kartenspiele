name: Update Spritpreise

on:
  schedule:
    # alle 30 Minuten, zwischen 06:00 und 22:00 UTC -> 08:00-00:00 MESZ
    - cron: "0,30 6-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Fetch fuel prices
        run: python .github/workflows/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "spritalarm-bot"
          git config user.email "spritalarm@users.noreply.github.com"
          git add spritpreise-pwa/data/prices.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update sprit prices"
          git push