name: Update Spritpreise

on:
  schedule:
    # alle 30 Minuten, 07:00-20:30 MESZ = 05:00-18:30 UTC
    - cron: "*/30 5-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Fetch fuel prices
        run: python .github/workflows/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "spritalarm-bot"
          git config user.email "spritalarm@users.noreply.github.com"
          git add spritpreise-pwa/data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes, but updating timestamp..."
            git commit --allow-empty -m "chore: update sprit prices check $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            git commit -m "chore: update sprit prices"
          fi
          git push