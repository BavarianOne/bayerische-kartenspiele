name: Update Spritpreise

on:
  schedule:
    # alle 30 Minuten, 07:00-20:30 MESZ = 05:00-18:30 UTC
    - cron: "*/30 5-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Fetch fuel prices
        run: python .github/workflows/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "spritalarm-bot"
          git config user.email "spritalarm@users.noreply.github.com"
          
          # Capture hash before
          BEFORE_HASH=$(git hash-object spritpreise-pwa/data/prices.json 2>/dev/null || echo "none")
          
          # Run fetch (already done in previous step, but ensure file is fresh)
          python .github/workflows/fetch_prices.py
          
          # Capture hash after
          AFTER_HASH=$(git hash-object spritpreise-pwa/data/prices.json 2>/dev/null || echo "none")
          
          echo "Before: $BEFORE_HASH"
          echo "After:  $AFTER_HASH"
          
          if [ "$BEFORE_HASH" != "$AFTER_HASH" ]; then
            echo "File changed, committing..."
            git add spritpreise-pwa/data/prices.json
            git commit -m "chore: update sprit prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "File unchanged (should not happen with workflowRunAt), forcing commit..."
            # Force update workflowRunAt by touching and re-running
            python .github/workflows/fetch_prices.py
            git add spritpreise-pwa/data/prices.json
            git commit -m "chore: update sprit prices check $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi