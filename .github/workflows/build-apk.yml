name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install npm dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp *.html *.js *.css www/ 2>/dev/null || true
          cp -r data www/ 2>/dev/null || true

      - name: Initialize and Sync Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Bayerische Kartenspiele" "com.bayerische.kartenspiele" --web-dir "www"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Delete old releases
        run: |
          gh release list --limit 100 | tail -n +4 | awk '{print $1}' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Lösche altes Release: $tag"
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Build v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}