name: Build Metzger App APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Metzger APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Setup Metzger App
        run: |
          cd /home/runner/work/bayerische-kartenspiele/bayerische-kartenspiele
          # Create dedicated metzger app structure
          mkdir -p metzger-app/www
          cp metzger-angebote.html metzger-app/www/index.html
          cp data/metzger/wasner.json metzger-app/www/data.json
          cp -r data/metzger metzger-app/www/data 2>/dev/null || true

      - name: Setup Capacitor in Metzger App
        run: |
          cd metzger-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Metzger Angebote" "de.bavarianone.metzgerangebote" --web-dir=www
          npx cap add android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Android (debug)
        run: |
          cd metzger-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Delete old releases
        uses: dev-drpr/delete-old-releases@v1.0.1
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: metzger-v1.0.${{ github.run_number }}
          name: Metzger App Build v1.0.${{ github.run_number }}
          files: metzger-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}roflows# l
